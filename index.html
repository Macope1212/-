<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt 3D FPS Spel</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; background: white;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.8; z-index: 10; display: none;
        }
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        #start-button {
            padding: 20px 40px; font-size: 24px; font-weight: bold; background: #ff4500;
            color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #start-button:hover { background: #ff5722; }
    </style>
</head>
<body>

    <!-- Startskärm som tvingar webbläsaren att uppdatera -->
    <div id="start-overlay">
        <button id="start-button">STARTA SPELET (KLICKA HÄR)</button>
    </div>

    <!-- Sikte i mitten -->
    <div id="crosshair"></div>

    <!-- Stabil och säker JavaScript-länk för 3D-motorn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Inställningar för 3D-scen och kamera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Garanterat ljusblå himmel

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0); // Startar i ögonhöjd (2 meter upp från marken)

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Allmänt ljus i världen
        const light = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(light);

        // 2. Det gröna gräset (Marken)
        const floorGeo = new THREE.PlaneGeometry(2000, 2000);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x2e8b57 }); // Garanterat grönt gräs
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 3. FUNKTION FÖR ATT SKAPA FINA BYGGNADER (Väggar, dörr och spetsigt tak)
        function createBuilding(x, z, width, height, depth, wallColor, roofColor) {
            const buildingGroup = new THREE.Group();

            // Husets väggar
            const wallGeo = new THREE.BoxGeometry(width, height, depth);
            const wallMat = new THREE.MeshBasicMaterial({ color: wallColor });
            const walls = new THREE.Mesh(wallGeo, wallMat);
            walls.position.y = height / 2; // Sätt huset på marken
            buildingGroup.add(walls);

            // Spetsigt tak (Kon)
            const roofHeight = width * 0.5;
            const roofGeo = new THREE.ConeGeometry(Math.max(width, depth) * 0.75, roofHeight, 4);
            const roofMat = new THREE.MeshBasicMaterial({ color: roofColor });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = height + (roofHeight / 2);
            roof.rotation.y = Math.PI / 4; // Rotera taket så det passar dörren perfekt
            buildingGroup.add(roof);

            // En dörr (Svart rektangel)
            const doorGeo = new THREE.BoxGeometry(width * 0.25, height * 0.25, 0.1);
            const doorMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, (height * 0.25) / 2, (depth / 2) + 0.01); 
            buildingGroup.add(door);

            // Placera ut hela huspaketet på gräset
            buildingGroup.position.set(x, 0, z);
            scene.add(buildingGroup);
        }

        // Färgpaletter till staden
        const houseColors = [0xdd4b39, 0xf39c12, 0x3498db, 0x9b59b6, 0xe74c3c, 0x95a5a6]; // Röd, Orange, Blå, Lila, Mörkröd, Grå
        const roofColors = [0x2c3e50, 0x7f8c8d, 0x111111, 0x34495e]; // Olika mörka takfärger

        // Generera 35 fina hus utspridda på gräset
        for (let i = 0; i < 35; i++) {
            const x = (Math.random() - 0.5) * 160;
            const z = (Math.random() - 0.5) * 160;
            
            // Slumpa storlekar på husen
            const w = 6 + Math.random() * 5;
            const h = 6 + Math.random() * 10;
            const d = 6 + Math.random() * 5;

            const randomWall = houseColors[Math.floor(Math.random() * houseColors.length)];
            const randomRoof = roofColors[Math.floor(Math.random() * roofColors.length)];

            // Se till att inga hus byggs precis där man spawnar (0,0)
            if (Math.abs(x) < 10 && Math.abs(z) < 10) {
                continue; 
            }

            createBuilding(x, z, w, h, d, randomWall, randomRoof);
        }

        // Generera 6 stycken jättehöga skyskrapor i bakgrunden (med gula tak)
        for (let i = 0; i < 6; i++) {
            const x = (Math.random() - 0.5) * 240;
            const z = (Math.random() - 0.5) * 240;

            if (Math.abs(x) < 35 && Math.abs(z) < 35) continue; // Håll spawn-ytan ren

            createBuilding(x, z, 12, 40 + Math.random() * 20, 12, 0x2c3e50, 0xf1c40f);
        }

        // 4. Hantering av mus och låsning
        let cameraYAngle = 0; 
        let cameraXAngle = 0; 
        let isMouseLocked = false;

        const startOverlay = document.getElementById('start-overlay');
        const startButton = document.getElementById('start-button');
        const crosshair = document.getElementById('crosshair');

        startButton.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === renderer.domElement) {
                isMouseLocked = true;
                startOverlay.style.display = 'none';
                crosshair.style.display = 'block';
            } else {
                isMouseLocked = false;
                startOverlay.style.display = 'flex';
                crosshair.style.display = 'none';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isMouseLocked) {
                cameraYAngle -= e.movementX * 0.002;
                cameraXAngle -= e.movementY * 0.002;
                cameraXAngle = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, cameraXAngle)); // Spärr för tak/mark
            }
        });

        // 5. Tangentbords-inputs
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0;
        let isGrounded = true;
        let lastTime = performance.now();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // 6. Spelslingan (Rörelse & Fysik)
        function animate() {
            requestAnimationFrame(animate);

            const timeNow = performance.now();
            const delta = Math.min((timeNow - lastTime) / 1000, 0.1);
            lastTime = timeNow;

            if (isMouseLocked) {
                let moveX = 0;
                let moveZ = 0;

                if (keys.w) { moveX += Math.sin(cameraYAngle); moveZ += Math.cos(cameraYAngle); }
                if (keys.s) { moveX -= Math.sin(cameraYAngle); moveZ -= Math.cos(cameraYAngle); }
                if (keys.a) { moveX += Math.cos(cameraYAngle); moveZ -= Math.sin(cameraYAngle); }
                if (keys.d) { moveX -= Math.cos(cameraYAngle); moveZ += Math.sin(cameraYAngle); }

                const speed = 16; // Gånghastighet
                camera.position.x += moveX * speed * delta;
                camera.position.z += moveZ * speed * delta;

                // Tyngdkraft och Hoppstyrka
                velocityY -= 28 * delta; 
                camera.position.y += velocityY * delta;

                if (keys.space && isGrounded) {
                    velocityY = 11;
                    isGrounded = false;
                }

                // Spärr så man inte faller igenom det gröna gräset
                if (camera.position.y < 2) {
                    camera.position.y = 2;
                    velocityY = 0;
                    isGrounded = true;
                }
            }

            // Uppdatera vart kameran pekar utifrån musvinklarna
            const target = new THREE.Vector3();
            target.x = camera.position.x + Math.sin(cameraYAngle) * Math.cos(cameraXAngle);
            target.z = camera.position.z + Math.cos(cameraYAngle) * Math.cos(cameraXAngle);
            target.y = camera.position.y + Math.sin(cameraXAngle);
            camera.lookAt(target);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
