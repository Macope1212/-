<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desert War Zone - Ultra Graphics</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: white; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.8; z-index: 10; display: none;
        }
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: flex; justify-content: center;
            align-items: center; z-index: 100; color: white; cursor: pointer;
        }
        .start-text {
            padding: 20px 40px; font-size: 24px; font-weight: bold; background: #d35400;
            border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div class="start-text">STARTA ÖKENKRIGET (ULTRA GRAFIK)</div>
    </div>
    <div id="crosshair"></div>

    <script src="https://cloudflare.com"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd5a97a); 
        scene.fog = new THREE.FogExp2(0xd5a97a, 0.02); // Atmosfärisk sandstorm

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0); 

        // Rendererare inställd för vacker och mjuk 3D-grafik (Antialias + Skuggor)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Ger mjuka, fina skuggor
        document.body.appendChild(renderer.domElement);

        // LJUSUPPGRADERING: Omgivningsljus + en stark sol som kastar skuggor
        const ambientLight = new THREE.AmbientLight(0xfff0e0, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffe0bd, 1.2);
        sunLight.position.set(40, 80, 40);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048; // Högupplösta skuggor
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 300;
        const d = 100;
        sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // MATERIALUPPGRADERING: Ökensand som reagerar på ljus (MeshStandardMaterial)
        const floorGeo = new THREE.PlaneGeometry(2000, 2000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xc29d70, roughness: 0.9, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true; // Marken tar emot skuggor från husen
        scene.add(floor);

        // Krigshärjade byggnader med avancerade skuggmaterial
        const colors = [0x555d50, 0x3e3a36, 0x7b3f00, 0x4a4135, 0x8b0000]; 
        for (let i = 0; i < 45; i++) {
            const x = (Math.random() - 0.5) * 160;
            const z = (Math.random() - 0.5) * 160;
            if (Math.abs(x) < 12 && Math.abs(z) < 12) continue;

            const w = 7 + Math.random() * 6;
            const h = 8 + Math.random() * 12;
            const dDepth = 7 + Math.random() * 6;
            const col = colors[Math.floor(Math.random() * colors.length)];

            const bGroup = new THREE.Group();
            const dmg = Math.random();
            // Matt material med struktur för sliten krigskänsla
            const wallMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.8, metalness: 0.2 });

            if (dmg > 0.4) {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, dDepth), wallMat);
                wall.position.y = h / 2;
                wall.castShadow = true; wall.receiveShadow = true;
                bGroup.add(wall);
            } else if (dmg > 0.15) {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h * 0.7, dDepth), wallMat);
                wall.position.y = (h * 0.7) / 2;
                wall.castShadow = true; wall.receiveShadow = true;
                bGroup.add(wall);
                bGroup.rotation.z = (Math.random() - 0.5) * 0.3; // Lutande bombat hus
            } else {
                for (let j = 0; j < 3; j++) {
                    const rubbleMat = new THREE.MeshStandardMaterial({ color: 0x3e3a36, roughness: 0.9 });
                    const rubble = new THREE.Mesh(new THREE.BoxGeometry(w * 0.6, 2, dDepth * 0.6), rubbleMat);
                    rubble.position.set((Math.random() - 0.5) * 4, 1, (Math.random() - 0.5) * 4);
                    rubble.castShadow = true; rubble.receiveShadow = true;
                    bGroup.add(rubble);
                }
            }
            bGroup.position.set(x, 0, z);
            scene.add(bGroup);
        }

        // Mus- och skärmkontroll
        let cameraYAngle = 0, cameraXAngle = 0, isMouseLocked = false;
        const startOverlay = document.getElementById('start-overlay');
        const crosshair = document.getElementById('crosshair');

        startOverlay.addEventListener('click', () => { renderer.domElement.requestPointerLock(); });

        document.addEventListener('pointerlockchange', () => {
            isMouseLocked = (document.pointerLockElement === renderer.domElement);
            startOverlay.style.display = isMouseLocked ? 'none' : 'flex';
            crosshair.style.display = isMouseLocked ? 'block' : 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (isMouseLocked) {
                cameraYAngle -= e.movementX * 0.002;
                cameraXAngle -= e.movementY * 0.002;
                cameraXAngle = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, cameraXAngle));
            }
        });

        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0, isGrounded = true, lastTime = performance.now();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true; if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true; if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false; if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false; if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        function animate() {
            requestAnimationFrame(animate);
            const timeNow = performance.now();
            const delta = Math.min((timeNow - lastTime) / 1000, 0.1);
            lastTime = timeNow;

            if (isMouseLocked) {
                let moveX = 0, moveZ = 0;
                if (keys.w) { moveX += Math.sin(cameraYAngle); moveZ += Math.cos(cameraYAngle); }
                if (keys.s) { moveX -= Math.sin(cameraYAngle); moveZ -= Math.cos(cameraYAngle); }
                if (keys.a) { moveX += Math.cos(cameraYAngle); moveZ -= Math.sin(cameraYAngle); }
                if (keys.d) { moveX -= Math.cos(cameraYAngle); moveZ += Math.sin(cameraYAngle); }

                camera.position.x += moveX * 15 * delta;
                camera.position.z += moveZ * 15 * delta;
                velocityY -= 28 * delta; camera.position.y += velocityY * delta;

                if (keys.space && isGrounded) { velocityY = 11; isGrounded = false; }
                if (camera.position.y < 2) { camera.position.y = 2; velocityY = 0; isGrounded = true; }
            }

            const target = new THREE.Vector3();
            target.x = camera.position.x + Math.sin(cameraYAngle) * Math.cos(cameraXAngle);
            target.z = camera.position.z + Math.cos(cameraYAngle) * Math.cos(cameraXAngle);
            target.y = camera.position.y + Math.sin(cameraXAngle);
            camera.lookAt(target);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
