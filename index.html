<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt 3D FPS Spel</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; font-family: sans-serif; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; background: white;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.8; z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Sikte i mitten av skärmen -->
    <div id="crosshair"></div>

    <!-- HÄR ÄR DEN RÄTTA LÄNKEN SOM FIXAR ALLT -->
    <script src="https://cloudflare.com"></script>

    <script>
        // 1. Starta 3D-världen och kameran i ögonhöjd
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Blå himmel

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0); // Startar 2 meter upp på marken (ögonhöjd)

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Enkelt ljus som lyser upp världen direkt
        const light = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(light);

        // 2. Det gröna gräset (Marken)
        const floorGeo = new THREE.PlaneGeometry(1000, 1000);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x2e8b57 }); // Garanterat stabilt grönt gräs
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 3. Färgglada pelare runt omkring så du ser när du går runt
        const boxGeo = new THREE.BoxGeometry(3, 8, 3);
        const colors = [0xff4500, 0xffd700, 0x1e90ff, 0x9370db]; // Röd, Guld, Blå, Lila

        for (let i = 0; i < 40; i++) {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const boxMat = new THREE.MeshBasicMaterial({ color: randomColor });
            const box = new THREE.Mesh(boxGeo, boxMat);
            
            box.position.x = (Math.random() - 0.5) * 120;
            box.position.z = (Math.random() - 0.5) * 120;
            box.position.y = 4; // Står stabilt på marken
            
            // Flytta bort block från startytan så inget block kraschar i ansiktet direkt
            if (Math.abs(box.position.x) < 6 && Math.abs(box.position.z) < 6) {
                box.position.z -= 15;
            }
            scene.add(box);
        }

        // 4. Muskontroller (Klicka på skärmen för att låsa musen och titta runt)
        let cameraYAngle = 0; 
        let cameraXAngle = 0; 
        let isMouseLocked = false;

        document.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isMouseLocked = (document.pointerLockElement === renderer.domElement);
        });

        document.addEventListener('mousemove', (e) => {
            if (isMouseLocked) {
                cameraYAngle -= e.movementX * 0.002;
                cameraXAngle -= e.movementY * 0.002;
                
                // Spärr så du inte kan slå runt kameran uppochner
                cameraXAngle = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, cameraXAngle));
            }
        });

        // 5. Tangentbordskontroller för W, A, S, D och Hopp (Mellanslag)
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0;
        let isGrounded = true;
        let lastTime = performance.now();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // 6. Spelslingan (Hanterar fysik och rörelse)
        function animate() {
            requestAnimationFrame(animate);

            const timeNow = performance.now();
            const delta = Math.min((timeNow - lastTime) / 1000, 0.1);
            lastTime = timeNow;

            let moveX = 0;
            let moveZ = 0;

            // Räkna ut rörelseriktning utifrån vart du tittar
            if (keys.w) { moveX += Math.sin(cameraYAngle); moveZ += Math.cos(cameraYAngle); }
            if (keys.s) { moveX -= Math.sin(cameraYAngle); moveZ -= Math.cos(cameraYAngle); }
            if (keys.a) { moveX += Math.cos(cameraYAngle); moveZ -= Math.sin(cameraYAngle); }
            if (keys.d) { moveX -= Math.cos(cameraYAngle); moveZ += Math.sin(cameraYAngle); }

            // Flytta kameran (Dig)
            const speed = 12;
            if (moveX !== 0 || moveZ !== 0) {
                camera.position.x += moveX * speed * delta;
                camera.position.z += moveZ * speed * delta;
            }

            // Gravitation och Hoppstyrka
            velocityY -= 24 * delta; 
            camera.position.y += velocityY * delta;

            if (keys.space && isGrounded) {
                velocityY = 10; // Hopphöjd
                isGrounded = false;
            }

            // Hindra spelaren från att falla igenom gräset (ögonhöjd = 2 meter)
            if (camera.position.y < 2) {
                camera.position.y = 2;
                velocityY = 0;
                isGrounded = true;
            }

            // Uppdatera kamerans blick utifrån musrörelsen
            const target = new THREE.Vector3();
            target.x = camera.position.x + Math.sin(cameraYAngle) * Math.cos(cameraXAngle);
            target.z = camera.position.z + Math.cos(cameraYAngle) * Math.cos(cameraXAngle);
            target.y = camera.position.y + Math.sin(cameraXAngle);
            camera.lookAt(target);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
