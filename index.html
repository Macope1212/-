<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desert War Zone - Unblocked</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #d5a97a; font-family: sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: white; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.8; display: none; z-index: 10;
        }
        #info-text {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #fff; font-size: 18px; font-weight: bold; pointer-events: none;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8); z-index: 5;
        }
    </style>
</head>
<body>

    <div id="info-text">KLICKA PÅ SKÄRMEN FÖR ATT STARTA (W,A,S,D = GÅ | SPACE = HOPPA)</div>
    <div id="crosshair"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // Inbyggd mini-3D-motor för att helt runda skolans brandvägg
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const infoText = document.getElementById('info-text');
        const crosshair = document.getElementById('crosshair');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Spelarens tillstånd
        const player = { x: 0, y: 2, z: 0, yaw: 0, pitch: 0 };
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let isMouseLocked = false, velocityY = 0, isGrounded = true, lastTime = performance.now();

        // Generera krigshärjade ruiner och rasmassor
        const buildings = [];
        const colors = ['#555d50', '#3e3a36', '#7b3f00', '#4a4135', '#8b0000']; // Militärgrön, aska, rost, mörkröd
        
        for (let i = 0; i < 40; i++) {
            const bx = (Math.random() - 0.5) * 150;
            const bz = 15 + Math.random() * 150; // Placera framför startpunkten
            if (Math.abs(bx) < 10 && Math.abs(bz) < 15) continue;

            const w = 6 + Math.random() * 6;
            const h = 8 + Math.random() * 12;
            const d = 6 + Math.random() * 6;
            const col = colors[Math.floor(Math.random() * colors.length)];
            const dmg = Math.random();

            buildings.push({ x: bx, z: bz, w: w, h: h, d: d, color: col, dmg: dmg });
        }

        // Interaktion & Muslåsning
        canvas.addEventListener('click', () => { canvas.requestPointerLock(); });
        document.addEventListener('pointerlockchange', () => {
            isMouseLocked = (document.pointerLockElement === canvas);
            crosshair.style.display = isMouseLocked ? 'block' : 'none';
            infoText.style.display = isMouseLocked ? 'none' : 'block';
        });

        document.addEventListener('mousemove', (e) => {
            if (isMouseLocked) {
                player.yaw -= e.movementX * 0.0025;
                player.pitch -= e.movementY * 0.0025;
                player.pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, player.pitch));
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true; if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true; if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false; if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false; if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // Matte-funktion för att projicera 3D till din 2D-skärm
        function project(x, y, z) {
            // Relativt till spelarens position
            let rx = x - player.x;
            let ry = y - player.y;
            let rz = z - player.z;

            // Rotera runt Y-axeln (Kolla vart spelaren tittar)
            const cosY = Math.cos(-player.yaw), sinY = Math.sin(-player.yaw);
            const rotX = rx * cosY - rz * sinY;
            const rotZ = rx * sinY + rz * cosY;

            // Rotera runt X-axeln (Titta upp/ner)
            const cosX = Math.cos(-player.pitch), sinX = Math.sin(-player.pitch);
            const finalY = ry * cosX - rotZ * sinX;
            const finalZ = ry * sinX + rotZ * cosX;

            if (finalZ <= 0.1) return null; // Bakom kameran

            // Perspektiv-skalning
            const fov = Math.min(canvas.width, canvas.height);
            const screenX = (rotX / finalZ) * fov + canvas.width / 2;
            const screenY = -(finalY / finalZ) * fov + canvas.height / 2;
            return { x: screenX, y: screenY, depth: finalZ };
        }

        // Rit-funktion för 3D-blocken
        function drawCube(b) {
            const h = b.dmg > 0.4 ? b.h : b.h * 0.6; // Minska höjden på skadade hus
            
            // Fyrkantens 8 hörn i 3D-rymden
            const vertices = [
                {x: b.x - b.w/2, y: 0, z: b.z - b.d/2}, {x: b.x + b.w/2, y: 0, z: b.z - b.d/2},
                {x: b.x + b.w/2, y: h, z: b.z - b.d/2}, {x: b.x - b.w/2, y: h, z: b.z - b.d/2},
                {x: b.x - b.w/2, y: 0, z: b.z + b.d/2}, {x: b.x + b.w/2, y: 0, z: b.z + b.d/2},
                {x: b.x + b.w/2, y: h, z: b.z + b.d/2}, {x: b.x - b.w/2, y: h, z: b.z + b.d/2}
            ];

            const pts = vertices.map(v => project(v.x, v.y, v.z));
            if (pts.includes(null)) return; // Skippa om något hörn är bakom oss

            // Sidor index
            const faces = [, [1, 5, 6, 2], [5, 4, 7, 6], [4, 0, 3, 7], [3, 2, 6, 7]
            ];

            ctx.fillStyle = b.dmg < 0.15 ? '#3e3a36' : b.color; // Gör rasmassor askgrå
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;

            faces.forEach(face => {
                ctx.beginPath();
                ctx.moveTo(pts[face[0]].x, pts[face[0]].y);
                for(let i = 1; i < 4; i++) ctx.lineTo(pts[face[i]].x, pts[face[i]].y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });
        }

        // Spelslingan (Fysik och Grafikuppdatering)
        function gameLoop() {
            requestAnimationFrame(gameLoop);
            const timeNow = performance.now();
            const delta = Math.min((timeNow - lastTime) / 1000, 0.1);
            lastTime = timeNow;

            if (isMouseLocked) {
                let moveX = 0, moveZ = 0;
                if (keys.w) { moveX += Math.sin(player.yaw); moveZ += Math.cos(player.yaw); }
                if (keys.s) { moveX -= Math.sin(player.yaw); moveZ -= Math.cos(player.yaw); }
                if (keys.a) { moveX += Math.cos(player.yaw); moveZ -= Math.sin(player.yaw); }
                if (keys.d) { moveX -= Math.cos(player.yaw); moveZ += Math.sin(player.yaw); }

                player.x += moveX * 14 * delta;
                player.z += moveZ * 14 * delta;

                // Gravitation & Hopp
                velocityY -= 26 * delta;
                player.y += velocityY * delta;

                if (keys.space && isGrounded) { velocityY = 10; isGrounded = false; }
                if (player.y < 2) { player.y = 2; velocityY = 0; isGrounded = true; }
            }

            // RENDERING (Rita ut allt på skärmen)
            ctx.fillStyle = '#d5a97a'; // Sandfärgad bakgrund / sandstorm
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Rita horisont/markgräns
            ctx.fillStyle = '#c29d70'; // Ökensandens mark
            ctx.fillRect(0, canvas.height / 2 + Math.tan(player.pitch) * (canvas.height/2), canvas.width, canvas.height);

            // Sortera byggnader efter avstånd (så de som är långt borta ritas först)
            buildings.forEach(b => {
                b.dist = Math.pow(b.x - player.x, 2) + Math.pow(b.z - player.z, 2);
            });
            buildings.sort((a, b) => b.dist - a.dist);

            // Rita ut alla byggnader
            buildings.forEach(b => drawCube(b));
        }

        gameLoop();
    </script>
</body>
</html>
