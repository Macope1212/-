<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt fungerande 3D Spel</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; font-family: sans-serif; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; 
            background: white; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.5;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <script src="https://unpkg.com"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8 }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const colliders = [];
        const boxGeo = new THREE.BoxGeometry(4, 2, 4);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
        for(let i = 0; i < 30; i++) {
            const box = new THREE.Mesh(boxGeo, boxMat);
            const bx = (Math.random() - 0.5) * 150;
            const bz = (Math.random() - 0.5) * 150;
            box.position.set(bx, 1, bz);
            box.receiveShadow = true;
            box.castShadow = true;
            scene.add(box);
            colliders.push({ x: bx, z: bz, size: 4 });
        }

        const playerGroup = new THREE.Group();
        scene.add(playerGroup);
        playerGroup.position.set(0, 0, 0);

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xff4500 });

        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), bodyMat);
        torso.position.y = 1.65; torso.castShadow = true; playerGroup.add(torso);

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3), bodyMat);
        neck.position.y = 2.5; neck.castShadow = true; playerGroup.add(neck);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), skinMat);
        head.position.y = 2.9; head.castShadow = true; playerGroup.add(head);

        const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), skinMat);
        leftArm.position.set(-0.8, 1.65, 0); leftArm.castShadow = true; playerGroup.add(leftArm);

        const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), skinMat);
        rightArm.position.set(0.8, 1.65, 0); rightArm.castShadow = true; playerGroup.add(rightArm);

        const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.9, 0.4), skinMat);
        leftLeg.position.set(-0.35, 0.45, 0); leftLeg.castShadow = true; playerGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.9, 0.4), skinMat);
        rightLeg.position.set(0.35, 0.45, 0); rightLeg.castShadow = true; playerGroup.add(rightLeg);

        let cameraYAngle = 0, cameraXAngle = 0.3, isMouseLocked = false;

        document.addEventListener('click', () => { renderer.domElement.requestPointerLock(); });
        document.addEventListener('pointerlockchange', () => { isMouseLocked = (document.pointerLockElement === renderer.domElement); });

        document.addEventListener('mousemove', (e) => {
            if (isMouseLocked) {
                cameraYAngle -= e.movementX * 0.002;
                cameraXAngle -= e.movementY * 0.002;
                cameraXAngle = Math.max(-0.5, Math.min(0.8, cameraXAngle));
            }
        });

        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0, isGrounded = true, lastTime = performance.now();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true; if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true; if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false; if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false; if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        function animate() {
            requestAnimationFrame(animate);
            const timeNow = performance.now();
            const delta = Math.min((timeNow - lastTime) / 1000, 0.1);
            lastTime = timeNow;

            let moveX = 0, moveZ = 0;
            if (keys.w) { moveX += Math.sin(cameraYAngle); moveZ += Math.cos(cameraYAngle); }
            if (keys.s) { moveX -= Math.sin(cameraYAngle); moveZ -= Math.cos(cameraYAngle); }
            if (keys.a) { moveX += Math.cos(cameraYAngle); moveZ -= Math.sin(cameraYAngle); }
            if (keys.d) { moveX -= Math.cos(cameraYAngle); moveZ += Math.sin(cameraYAngle); }

            const speed = 8;
            if (moveX !== 0 || moveZ !== 0) {
                const nextX = playerGroup.position.x + moveX * speed * delta;
                const nextZ = playerGroup.position.z + moveZ * speed * delta;
                let hitX = false, hitZ = false;
                const radius = 0.8;

                for (let i = 0; i < colliders.length; i++) {
                    const b = colliders[i];
                    const half = b.size / 2;
                    if (nextX + radius > b.x - half && nextX - radius < b.x + half && playerGroup.position.z + radius > b.z - half && playerGroup.position.z - radius < b.z + half) hitX = true;
                    if (playerGroup.position.x + radius > b.x - half && playerGroup.position.x - radius < b.x + half && nextZ + radius > b.z - half && nextZ - radius < b.z + half) hitZ = true;
                }

                if (!hitX) playerGroup.position.x = nextX;
                if (!hitZ) playerGroup.position.z = nextZ;
                playerGroup.rotation.y = Math.atan2(moveX, moveZ);

                const walkTime = timeNow * 0.01;
                leftLeg.rotation.x = Math.sin(walkTime) * 0.5; rightLeg.rotation.x = -Math.sin(walkTime) * 0.5;
                leftArm.rotation.x = -Math.sin(walkTime) * 0.5; rightArm.rotation.x = Math.sin(walkTime) * 0.5;
            } else {
                leftLeg.rotation.x = 0; rightLeg.rotation.x = 0; leftArm.rotation.x = 0; rightArm.rotation.x = 0;
            }

            velocityY -= 22 * delta; playerGroup.position.y += velocityY * delta;
            if (keys.space && isGrounded) { velocityY = 9; isGrounded = false; }
            if (playerGroup.position.y < 0) { playerGroup.position.y = 0; velocityY = 0; isGrounded = true; }

            const r = 6;
            camera.position.x = playerGroup.position.x - r * Math.sin(cameraYAngle) * Math.cos(cameraXAngle);
            camera.position.z = playerGroup.position.z - r * Math.cos(cameraYAngle) * Math.cos(cameraXAngle);
            camera.position.y = playerGroup.position.y + 2.2 + r * Math.sin(cameraXAngle);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
