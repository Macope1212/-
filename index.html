<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt 3D Spel</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #87ceeb; }
        canvas { display: block; }
    </style>
</head>
<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // 1. Scen, himmel och rendering
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Blå himmel
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Ljus
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 2. Grönt gräs (Marken)
        const floorGeo = new THREE.PlaneGeometry(2000, 2000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8 }); // Gräsgrön
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Några bruna block i världen att gå runt eller hoppa på
        const boxGeo = new THREE.BoxGeometry(4, 2, 4);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
        for(let i = 0; i < 30; i++) {
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.set((Math.random() - 0.5) * 150, 1, (Math.random() - 0.5) * 150);
            box.receiveShadow = true;
            box.castShadow = true;
            scene.add(box);
        }

        // 3. SKAPA 3D-GUBBEN
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);
        playerGroup.position.set(0, 0, 0); // Startposition på marken

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333 }); // Mörkgrå mage
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xff4500 }); // Orange delar

        // Mage / Torso
        const torsoGeo = new THREE.BoxGeometry(1.2, 1.5, 0.8);
        const torso = new THREE.Mesh(torsoGeo, bodyMat);
        torso.position.y = 1.65;
        torso.castShadow = true;
        playerGroup.add(torso);

        // Hals
        const neckGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.3);
        const neck = new THREE.Mesh(neckGeo, bodyMat);
        neck.position.y = 2.5;
        neck.castShadow = true;
        playerGroup.add(neck);

        // Huvud
        const headGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
        const head = new THREE.Mesh(headGeo, skinMat);
        head.position.y = 2.9;
        head.castShadow = true;
        playerGroup.add(head);

        // Vänster arm
        const leftArmGeo = new THREE.BoxGeometry(0.3, 1.2, 0.3);
        const leftArm = new THREE.Mesh(leftArmGeo, skinMat);
        leftArm.position.set(-0.8, 1.65, 0);
        leftArm.castShadow = true;
        playerGroup.add(leftArm);

        // Höger arm
        const rightArmGeo = new THREE.BoxGeometry(0.3, 1.2, 0.3);
        const rightArm = new THREE.Mesh(rightArmGeo, skinMat);
        rightArm.position.set(0.8, 1.65, 0);
        rightArm.castShadow = true;
        playerGroup.add(rightArm);

        // Vänster ben
        const leftLegGeo = new THREE.BoxGeometry(0.4, 0.9, 0.4);
        const leftLeg = new THREE.Mesh(leftLegGeo, skinMat);
        leftLeg.position.set(-0.35, 0.45, 0);
        leftLeg.castShadow = true;
        playerGroup.add(leftLeg);

        // Höger ben
        const rightLegGeo = new THREE.BoxGeometry(0.4, 0.9, 0.4);
        const rightLeg = new THREE.Mesh(rightLegGeo, skinMat);
        rightLeg.position.set(0.35, 0.45, 0);
        rightLeg.castShadow = true;
        playerGroup.add(rightLeg);

        // 4. Säkra startvinklar för kameran så den inte kraschar direkt
        let cameraYAngle = 0; // Titta rakt framåt från start
        let cameraXAngle = 0.2; // Titta svagt nedåt på gubben från start

        const controls = new PointerLockControls(camera, document.body);
        
        // Klicka på skärmen för att låsa musen och kunna titta runt
        document.addEventListener('click', () => {
            controls.lock();
        });

        document.addEventListener('mousemove', (e) => {
            if (controls.isLocked) {
                cameraYAngle -= e.movementX * 0.002;
                cameraXAngle -= e.movementY * 0.002;
                cameraXAngle = Math.max(-0.5, Math.min(0.8, cameraXAngle)); // Spärr för upp/ner
            }
        });

        // Tangentbord
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0;
        let isGrounded = true;
        const clock = new THREE.Clock();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // 5. Spelslingan (Körs hela tiden)
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            // Kolla rörelse (Detta fungerar oavsett om musen är låst eller inte!)
            let moveX = 0;
            let moveZ = 0;

            if (keys.w) { moveX += Math.sin(cameraYAngle); moveZ += Math.cos(cameraYAngle); }
            if (keys.s) { moveX -= Math.sin(cameraYAngle); moveZ -= Math.cos(cameraYAngle); }
            if (keys.a) { moveX += Math.cos(cameraYAngle); moveZ -= Math.sin(cameraYAngle); }
            if (keys.d) { moveX -= Math.cos(cameraYAngle); moveZ += Math.sin(cameraYAngle); }

            const speed = 8;
            if (moveX !== 0 || moveZ !== 0) {
                playerGroup.position.x += moveX * speed * delta;
                playerGroup.position.z += moveZ * speed * delta;
                playerGroup.rotation.y = Math.atan2(moveX, moveZ);

                // Gånganimation
                const time = Date.now() * 0.01;
                leftLeg.rotation.x = Math.sin(time) * 0.5;
                rightLeg.rotation.x = -Math.sin(time) * 0.5;
                leftArm.rotation.x = -Math.sin(time) * 0.5;
                rightArm.rotation.x = Math.sin(time) * 0.5;
            } else {
                // Stå still
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
                leftArm.rotation.x = 0;
                rightArm.rotation.x = 0;
            }

            // Fysik (Gravitation och hopp)
            velocityY -= 22 * delta;
            playerGroup.position.y += velocityY * delta;

            if (keys.space && isGrounded) {
                velocityY = 9;
                isGrounded = false;
            }

            // Stoppa gubben vid marknivå
            if (playerGroup.position.y < 0) {
                playerGroup.position.y = 0;
                velocityY = 0;
                isGrounded = true;
            }

            // 6. Placera ALLTID kameran stabilt bakom gubben
            const radius = 6; // Avstånd bakom gubben
            camera.position.x = playerGroup.position.x - radius * Math.sin(cameraYAngle) * Math.cos(cameraXAngle);
            camera.position.z = playerGroup.position.z - radius * Math.cos(cameraYAngle) * Math.cos(cameraXAngle);
            camera.position.y = playerGroup.position.y + 2.2 + radius * Math.sin(cameraXAngle);

            // Kameran tittar på gubben
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
