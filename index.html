<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Desert War Zone</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: Arial, sans-serif;
        user-select: none;
    }

    canvas {
        display: block;
    }

    #startScreen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background:
            radial-gradient(circle at center,
            rgba(150,100,40,.15),
            rgba(0,0,0,.95));
        color: white;
        text-align: center;
        cursor: pointer;
    }

    #startScreen h1 {
        font-size: clamp(32px, 6vw, 75px);
        margin: 0 0 20px;
        letter-spacing: 5px;
        text-shadow: 0 5px 20px black;
    }

    #startScreen p {
        font-size: 18px;
        opacity: .8;
        margin: 7px;
    }

    #startButton {
        margin-top: 30px;
        padding: 18px 35px;
        border: 2px solid #d8a84e;
        background: rgba(120,70,20,.45);
        color: white;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
    }

    #startButton:hover {
        background: rgba(180,110,30,.65);
    }

    #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        color: white;
    }

    #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        transform: translate(-50%, -50%);
    }

    #crosshair::before,
    #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255,255,255,.9);
        box-shadow: 0 0 4px black;
    }

    #crosshair::before {
        width: 2px;
        height: 22px;
        left: 10px;
        top: 0;
    }

    #crosshair::after {
        width: 22px;
        height: 2px;
        left: 0;
        top: 10px;
    }

    #fps {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 6px 10px;
        background: rgba(0,0,0,.45);
        border-radius: 5px;
        font-size: 13px;
    }

    #info {
        position: absolute;
        bottom: 15px;
        left: 15px;
        padding: 10px 14px;
        background: rgba(0,0,0,.45);
        border-radius: 7px;
        font-size: 14px;
        line-height: 1.5;
    }

    #weapon {
        position: absolute;
        right: 35px;
        bottom: 20px;
        width: 150px;
        height: 70px;
        transform: rotate(-5deg);
    }

    #weaponBody {
        position: absolute;
        width: 115px;
        height: 28px;
        right: 0;
        bottom: 25px;
        background: #252525;
        border-radius: 4px;
    }

    #weaponBarrel {
        position: absolute;
        width: 55px;
        height: 9px;
        right: 105px;
        bottom: 39px;
        background: #111;
    }

    #weaponGrip {
        position: absolute;
        width: 28px;
        height: 45px;
        right: 30px;
        bottom: -2px;
        background: #181818;
        transform: rotate(12deg);
        border-radius: 4px;
    }

    #hitMarker {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 35px;
        font-weight: bold;
        opacity: 0;
        transition: opacity .05s;
    }
</style>
</head>

<body>

<div id="startScreen">
    <h1>DESERT WAR ZONE</h1>

    <p>WASD = gå</p>
    <p>MUS = titta</p>
    <p>SPACE = hoppa</p>
    <p>VÄNSTERKLICK = skjut</p>

    <div id="startButton">
        STARTA ÖKENKRIGET
    </div>
</div>

<div id="hud">
    <div id="crosshair"></div>
    <div id="hitMarker">×</div>

    <div id="fps">
        FPS: <span id="fpsNumber">60</span>
    </div>

    <div id="info">
        WASD · SPACE · MUS · KLICK
    </div>

    <div id="weapon">
        <div id="weaponBarrel"></div>
        <div id="weaponBody"></div>
        <div id="weaponGrip"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   DESERT WAR ZONE
   OPTIMERAD VERSION
   ========================================================= */


/* ---------------------------------------------------------
   BASIC SETUP
--------------------------------------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xd9a95e);

scene.fog = new THREE.Fog(
    0xd9a95e,
    70,
    500
);


const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    700
);

camera.position.set(
    0,
    2,
    15
);


/* ---------------------------------------------------------
   RENDERER
--------------------------------------------------------- */

const renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "high-performance"
});

/*
   Begränsar pixel ratio.
   Detta är väldigt viktigt på Chromebook/laptop.
*/
renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 1.25)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

/*
   BasicShadowMap är billigare än mjukare shadow maps.
*/
renderer.shadowMap.type = THREE.BasicShadowMap;

document.body.appendChild(renderer.domElement);


/* ---------------------------------------------------------
   LIGHTING
--------------------------------------------------------- */

const ambientLight = new THREE.HemisphereLight(
    0xffe0a0,
    0x4b3520,
    1.5
);

scene.add(ambientLight);


const sun = new THREE.DirectionalLight(
    0xffd08a,
    2
);

sun.position.set(
    -100,
    150,
    80
);

sun.castShadow = true;


/*
   1024 istället för 2048.
   Betydligt billigare.
*/
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

sun.shadow.camera.left = -150;
sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150;
sun.shadow.camera.bottom = -150;

sun.shadow.camera.near = 1;
sun.shadow.camera.far = 400;

scene.add(sun);


/* ---------------------------------------------------------
   MATERIALS
--------------------------------------------------------- */

const sandMaterial = new THREE.MeshLambertMaterial({
    color: 0xc69a55
});

const sandDarkMaterial = new THREE.MeshLambertMaterial({
    color: 0x92703b
});

const concreteMaterial = new THREE.MeshLambertMaterial({
    color: 0x777064
});

const concreteDarkMaterial = new THREE.MeshLambertMaterial({
    color: 0x4f4a43
});

const metalMaterial = new THREE.MeshLambertMaterial({
    color: 0x383838
});

const woodMaterial = new THREE.MeshLambertMaterial({
    color: 0x67472d
});

const blackMaterial = new THREE.MeshLambertMaterial({
    color: 0x111111
});


/* ---------------------------------------------------------
   GROUND
--------------------------------------------------------- */

const groundGeometry =
    new THREE.PlaneGeometry(
        2000,
        2000
    );

const ground =
    new THREE.Mesh(
        groundGeometry,
        sandMaterial
    );

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* ---------------------------------------------------------
   COLLISION SYSTEM
--------------------------------------------------------- */

/*
   Alla byggnader får en enkel Box3-collider.

   Vi använder inte physics engine.
   Det är mycket snabbare för det här spelet.
*/

const buildingColliders = [];

const PLAYER_RADIUS = 0.65;


/*
   Testar om spelaren kan stå på x/z.
*/
function canMoveTo(x, z) {

    for (let i = 0; i < buildingColliders.length; i++) {

        const box = buildingColliders[i];

        if (
            x > box.min.x - PLAYER_RADIUS &&
            x < box.max.x + PLAYER_RADIUS &&
            z > box.min.z - PLAYER_RADIUS &&
            z < box.max.z + PLAYER_RADIUS
        ) {

            return false;
        }
    }

    return true;
}


/* ---------------------------------------------------------
   BUILDING
--------------------------------------------------------- */

function createBox(
    x,
    y,
    z,
    width,
    height,
    depth,
    material,
    parent
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}


function buildRuin(x, z) {

    const group = new THREE.Group();

    /*
       Slumpmässig men begränsad storlek.
    */

    const width =
        8 + Math.random() * 8;

    const depth =
        7 + Math.random() * 8;

    const height =
        4 + Math.random() * 5;


    /*
       Huvudväggar
    */

    createBox(
        0,
        height / 2,
        0,
        width,
        height,
        0.8,
        concreteMaterial,
        group
    );


    createBox(
        0,
        height / 2,
        depth,
        width,
        height,
        0.8,
        concreteDarkMaterial,
        group
    );


    createBox(
        0,
        height / 2,
        0,
        0.8,
        height,
        depth,
        concreteMaterial,
        group
    );


    createBox(
        width,
        height / 2,
        0,
        0.8,
        height,
        depth,
        concreteDarkMaterial,
        group
    );


    /*
       Delvis förstört tak.
    */

    if (Math.random() > 0.25) {

        createBox(
            width / 2,
            height + 0.3,
            depth / 2,
            width * 0.7,
            0.6,
            depth * 0.7,
            concreteDarkMaterial,
            group
        );
    }


    /*
       Dörröppning-look:
       mörkt block på ena sidan.
    */

    if (Math.random() > 0.4) {

        createBox(
            width / 2,
            1.5,
            -0.45,
            2.2,
            3,
            0.15,
            blackMaterial,
            group
        );
    }


    /*
       Lite skräp.
    */

    for (let i = 0; i < 4; i++) {

        const rubble =
            createBox(
                Math.random() * width,
                0.3 + Math.random() * 0.5,
                Math.random() * depth,
                0.5 + Math.random(),
                0.4 + Math.random() * 0.7,
                0.5 + Math.random(),
                concreteDarkMaterial,
                group
            );

        rubble.rotation.y =
            Math.random() * Math.PI;
    }


    group.position.set(
        x,
        0,
        z
    );


    /*
       Beräkna collider EN gång.
    */

    scene.updateMatrixWorld(true);

    const collider =
        new THREE.Box3()
            .setFromObject(group);

    buildingColliders.push(collider);


    return group;
}


/* ---------------------------------------------------------
   CRATERS
--------------------------------------------------------- */

function buildCrater(x, z) {

    const group =
        new THREE.Group();

    const size =
        2 + Math.random() * 2.5;

    const geometry =
        new THREE.CircleGeometry(
            size,
            16
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0x76532d,
            side: THREE.DoubleSide
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.rotation.x =
        -Math.PI / 2;

    mesh.position.y =
        0.015;

    group.add(mesh);

    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);
}


/* ---------------------------------------------------------
   ROCKS
--------------------------------------------------------- */

function createRock(x, z) {

    const size =
        0.4 + Math.random() * 1.2;

    const geometry =
        new THREE.DodecahedronGeometry(
            size,
            0
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            concreteDarkMaterial
        );

    mesh.position.set(
        x,
        size * 0.6,
        z
    );

    mesh.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
    );

    mesh.castShadow = true;

    scene.add(mesh);
}


/* ---------------------------------------------------------
   WORLD GENERATION
--------------------------------------------------------- */

/*
   Färre objekt = bättre FPS.
*/

const RUIN_COUNT = 32;


/*
   Förhindra att hus hamnar precis på varandra.
*/

const usedSpots = [];


function validSpot(x, z) {

    for (let i = 0; i < usedSpots.length; i++) {

        const dx =
            x - usedSpots[i].x;

        const dz =
            z - usedSpots[i].z;

        const distance =
            Math.sqrt(
                dx * dx +
                dz * dz
            );

        if (distance < 25) {
            return false;
        }
    }

    return true;
}


for (let i = 0; i < RUIN_COUNT; i++) {

    let x;
    let z;

    let attempts = 0;

    do {

        x =
            (Math.random() - 0.5) *
            360;

        z =
            (Math.random() - 0.5) *
            360;

        attempts++;

    } while (
        !validSpot(x, z) &&
        attempts < 100
    );


    usedSpots.push({
        x: x,
        z: z
    });


    const ruin =
        buildRuin(
            x,
            z
        );

    scene.add(ruin);


    if (Math.random() > 0.45) {

        buildCrater(
            x + (Math.random() - 0.5) * 20,
            z + (Math.random() - 0.5) * 20
        );
    }
}


/*
   Extra rocks.
*/

for (let i = 0; i < 70; i++) {

    const x =
        (Math.random() - 0.5) *
        500;

    const z =
        (Math.random() - 0.5) *
        500;

    createRock(
        x,
        z
    );
}


/* ---------------------------------------------------------
   DUST
--------------------------------------------------------- */

/*
   250 istället för 700.
*/

const dustCount = 250;

const dustPositions =
    new Float32Array(
        dustCount * 3
    );


for (let i = 0; i < dustCount; i++) {

    dustPositions[i * 3] =
        (Math.random() - 0.5) * 400;

    dustPositions[i * 3 + 1] =
        Math.random() * 12;

    dustPositions[i * 3 + 2] =
        (Math.random() - 0.5) * 400;
}


const dustGeometry =
    new THREE.BufferGeometry();

dustGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        dustPositions,
        3
    )
);


const dustMaterial =
    new THREE.PointsMaterial({
        color: 0xe0b875,
        size: 0.12,
        transparent: true,
        opacity: 0.45,
        depthWrite: false
    });


const dust =
    new THREE.Points(
        dustGeometry,
        dustMaterial
    );

scene.add(dust);


/* ---------------------------------------------------------
   PLAYER
--------------------------------------------------------- */

let yaw = 0;
let pitch = 0;

let velocityY = 0;

let grounded = true;

const keys = {
    w: false,
    a: false,
    s: false,
    d: false,
    space: false
};


const PLAYER_HEIGHT = 2;


/* ---------------------------------------------------------
   INPUT
--------------------------------------------------------- */

document.addEventListener(
    "keydown",
    function(e) {

        const key =
            e.key.toLowerCase();

        if (key === "w")
            keys.w = true;

        if (key === "a")
            keys.a = true;

        if (key === "s")
            keys.s = true;

        if (key === "d")
            keys.d = true;

        if (e.code === "Space") {

            keys.space = true;

            e.preventDefault();
        }
    }
);


document.addEventListener(
    "keyup",
    function(e) {

        const key =
            e.key.toLowerCase();

        if (key === "w")
            keys.w = false;

        if (key === "a")
            keys.a = false;

        if (key === "s")
            keys.s = false;

        if (key === "d")
            keys.d = false;

        if (e.code === "Space")
            keys.space = false;
    }
);


/* ---------------------------------------------------------
   MOUSE LOOK
--------------------------------------------------------- */

let mouseLocked = false;


document.addEventListener(
    "mousemove",
    function(e) {

        if (!mouseLocked)
            return;

        yaw -=
            e.movementX * 0.002;

        pitch -=
            e.movementY * 0.002;


        /*
           Hindrar att man tittar helt runt bakåt
           över huvudet.
        */

        const limit =
            Math.PI / 2 - 0.05;

        pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );
    }
);


document.addEventListener(
    "pointerlockchange",
    function() {

        mouseLocked =
            document.pointerLockElement ===
            renderer.domElement;
    }
);


/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

const startScreen =
    document.getElementById(
        "startScreen"
    );


startScreen.addEventListener(
    "click",
    function() {

        startScreen.style.display =
            "none";

        renderer.domElement.requestPointerLock();
    }
);


/* ---------------------------------------------------------
   SHOOTING
--------------------------------------------------------- */

const raycaster =
    new THREE.Raycaster();

const shootableObjects = [];


/*
   Lägg alla byggnadsdelar i listan.
*/

function collectShootableObjects(
    object
) {

    object.traverse(
        function(child) {

            if (child.isMesh) {

                shootableObjects.push(
                    child
                );
            }
        }
    );
}


/*
   Vänta tills världen är skapad.
*/

for (let i = 0; i < scene.children.length; i++) {

    const obj =
        scene.children[i];

    if (obj.type === "Group") {

        collectShootableObjects(
            obj
        );
    }
}


document.addEventListener(
    "mousedown",
    function(e) {

        if (e.button !== 0)
            return;

        if (!mouseLocked)
            return;

        shoot();
    }
);


function shoot() {

    raycaster.setFromCamera(
        new THREE.Vector2(0, 0),
        camera
    );

    const hits =
        raycaster.intersectObjects(
            shootableObjects,
            false
        );


    if (hits.length > 0) {

        const marker =
            document.getElementById(
                "hitMarker"
            );

        marker.style.opacity = "1";

        setTimeout(
            function() {
                marker.style.opacity = "0";
            },
            80
        );
    }
}


/* ---------------------------------------------------------
   MOVEMENT
--------------------------------------------------------- */

function updatePlayer(delta) {

    if (!mouseLocked)
        return;


    let forward = 0;
    let strafe = 0;


    if (keys.w)
        forward += 1;

    if (keys.s)
        forward -= 1;

    if (keys.d)
        strafe += 1;

    if (keys.a)
        strafe -= 1;


    /*
       Normalisera diagonal movement.
    */

    const length =
        Math.sqrt(
            forward * forward +
            strafe * strafe
        );


    if (length > 0) {

        forward /= length;
        strafe /= length;
    }


    const SPEED = 14;


    /*
       Kamera-riktning.
    */

    const dx =
        Math.sin(yaw);

    const dz =
        Math.cos(yaw);


    /*
       Forward/back.
    */

    let moveX =
        dx * forward;

    let moveZ =
        dz * forward;


    /*
       Strafe.
    */

    moveX +=
        Math.cos(yaw) * strafe;

    moveZ +=
        -Math.sin(yaw) * strafe;


    /*
       Framtida position.
    */

    const nextX =
        camera.position.x +
        moveX * SPEED * delta;

    const nextZ =
        camera.position.z +
        moveZ * SPEED * delta;


    /*
       VIKTIGT:

       X och Z testas separat.

       Det gör att spelaren kan glida längs
       en vägg istället för att fastna helt.
    */

    if (
        canMoveTo(
            nextX,
            camera.position.z
        )
    ) {

        camera.position.x =
            nextX;
    }


    if (
        canMoveTo(
            camera.position.x,
            nextZ
        )
    ) {

        camera.position.z =
            nextZ;
    }


    /* -----------------------------------------------------
       JUMP
    ----------------------------------------------------- */

    if (
        keys.space &&
        grounded
    ) {

        velocityY =
            10;

        grounded = false;
    }


    velocityY -=
        25 * delta;


    camera.position.y +=
        velocityY * delta;


    if (
        camera.position.y <=
        PLAYER_HEIGHT
    ) {

        camera.position.y =
            PLAYER_HEIGHT;

        velocityY = 0;

        grounded = true;
    }
}


/* ---------------------------------------------------------
   CAMERA
--------------------------------------------------------- */

const lookTarget =
    new THREE.Vector3();


function updateCamera() {

    lookTarget.set(
        camera.position.x -
            Math.sin(yaw) *
            Math.cos(pitch),

        camera.position.y +
            Math.sin(pitch),

        camera.position.z -
            Math.cos(yaw) *
            Math.cos(pitch)
    );


    camera.lookAt(
        lookTarget
    );
}


/* ---------------------------------------------------------
   DUST UPDATE
--------------------------------------------------------- */

function updateDust(delta) {

    const positions =
        dustGeometry.attributes.position.array;


    /*
       Uppdatera bara partiklarna.
    */

    for (
        let i = 0;
        i < dustCount;
        i++
    ) {

        const index =
            i * 3 + 1;

        positions[index] +=
            delta * 0.35;


        if (
            positions[index] > 12
        ) {

            positions[index] = 0;
        }
    }


    dustGeometry.attributes.position.needsUpdate =
        true;
}


/* ---------------------------------------------------------
   FPS
--------------------------------------------------------- */

const fpsNumber =
    document.getElementById(
        "fpsNumber"
    );

let fpsTimer = 0;
let fpsFrames = 0;


/* ---------------------------------------------------------
   ANIMATION
--------------------------------------------------------- */

let lastTime =
    performance.now();


function animate() {

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    /*
       Delta skyddas så att spelet inte
       hoppar jättelångt efter lagg.
    */

    let delta =
        (now - lastTime) / 1000;


    lastTime = now;


    delta =
        Math.min(
            delta,
            0.05
        );


    updatePlayer(
        delta
    );


    updateCamera();


    updateDust(
        delta
    );


    /*
       FPS-räknare uppdateras
       bara en gång per sekund.
    */

    fpsTimer += delta;
    fpsFrames++;


    if (fpsTimer >= 1) {

        fpsNumber.textContent =
            Math.round(
                fpsFrames /
                fpsTimer
            );

        fpsTimer = 0;
        fpsFrames = 0;
    }


    renderer.render(
        scene,
        camera
    );
}


/* ---------------------------------------------------------
   RESIZE
--------------------------------------------------------- */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* ---------------------------------------------------------
   START GAME
--------------------------------------------------------- */

animate();

</script>

</body>
</html>
