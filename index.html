<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desert War Zone</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
        canvas { display: block; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            margin: -5px 0 0 -5px;
            pointer-events: none; opacity: 0.9; z-index: 10; display: none;
        }

        #crosshair::before, #crosshair::after {
            content: ""; position: absolute; background: #fff;
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
        }

        #crosshair::before { left: 4px; top: 0; width: 2px; height: 10px; }
        #crosshair::after { top: 4px; left: 0; width: 10px; height: 2px; }

        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(60,40,20,0.85), rgba(0,0,0,0.95));
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 100; color: white; cursor: pointer;
        }

        .start-text {
            padding: 20px 40px; font-size: 24px; font-weight: bold; background: #d35400;
            border-radius: 10px; box-shadow: 0 5px 25px rgba(0,0,0,0.6); text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hint { margin-top: 18px; font-size: 13px; opacity: 0.7; letter-spacing: 1px; }

        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center;
            z-index: 200; color: #d35400; font-size: 18px; letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div id="loading">LADDAR ÖKENSTAD...</div>

    <div id="start-overlay" style="display:none;">
        <div class="start-text">STARTA ÖKENKRIGET (KLICKA HÄR)</div>
        <div class="hint">WASD för att röra dig &nbsp;·&nbsp; MELLANSLAG för att hoppa &nbsp;·&nbsp; MUS för att titta</div>
    </div>

    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>

        // ---------- GRUNDUPPSÄTTNING ----------

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance"
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;

        document.body.appendChild(renderer.domElement);


        // ---------- HIMMEL ----------

        function createSkyTexture() {

            const canvas = document.createElement('canvas');

            canvas.width = 2;
            canvas.height = 256;

            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, 256);

            grad.addColorStop(0, '#8fa8c9');
            grad.addColorStop(0.35, '#cfa878');
            grad.addColorStop(0.65, '#e8c896');
            grad.addColorStop(1, '#f2d9a8');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 2, 256);

            const tex = new THREE.CanvasTexture(canvas);

            tex.magFilter = THREE.LinearFilter;

            return tex;
        }

        const skyGeo = new THREE.SphereGeometry(500, 32, 15);

        const skyMat = new THREE.MeshBasicMaterial({
            map: createSkyTexture(),
            side: THREE.BackSide,
            fog: false
        });

        scene.add(new THREE.Mesh(skyGeo, skyMat));

        scene.fog = new THREE.FogExp2(0xd8b788, 0.016);


        // ---------- SOL ----------

        const sunSprite = new THREE.Sprite(
            new THREE.SpriteMaterial({
                color: 0xfff4d6,
                transparent: true,
                opacity: 0.9,
                fog: false
            })
        );

        sunSprite.scale.set(40, 40, 1);
        sunSprite.position.set(-150, 90, -250);

        scene.add(sunSprite);


        // ---------- LJUS ----------

        const sun = new THREE.DirectionalLight(0xffe9c4, 1.3);

        sun.position.set(-150, 90, -250);
        sun.castShadow = true;

        // Minskad upplösning för bättre FPS
        sun.shadow.mapSize.set(512, 512);

        sun.shadow.camera.left = -120;
        sun.shadow.camera.right = 120;
        sun.shadow.camera.top = 120;
        sun.shadow.camera.bottom = -120;

        sun.shadow.camera.far = 500;
        sun.shadow.bias = -0.0015;

        scene.add(sun);


        const hemi = new THREE.HemisphereLight(
            0xcbd8ea,
            0x8a6b45,
            0.55
        );

        scene.add(hemi);


        const ambient = new THREE.AmbientLight(
            0xfff0e0,
            0.25
        );

        scene.add(ambient);


        // ---------- MARK ----------

        function createSandTexture() {

            const size = 512;

            const canvas = document.createElement('canvas');

            canvas.width = size;
            canvas.height = size;

            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#c9a874';
            ctx.fillRect(0, 0, size, size);

            for (let i = 0; i < 9000; i++) {

                const x = Math.random() * size;
                const y = Math.random() * size;

                const shade = Math.random() * 40 - 20;

                const r = 148 + shade;
                const g = 122 + shade;
                const b = 82 + shade;

                ctx.fillStyle =
                    `rgba(${r},${g},${b},${0.15 + Math.random() * 0.2})`;

                ctx.fillRect(
                    x,
                    y,
                    1 + Math.random() * 2,
                    1 + Math.random() * 2
                );
            }

            for (let i = 0; i < 14; i++) {

                const x = Math.random() * size;
                const y = Math.random() * size;
                const r = 8 + Math.random() * 22;

                const grad = ctx.createRadialGradient(
                    x,
                    y,
                    0,
                    x,
                    y,
                    r
                );

                grad.addColorStop(
                    0,
                    'rgba(60,45,30,0.45)'
                );

                grad.addColorStop(
                    1,
                    'rgba(60,45,30,0)'
                );

                ctx.fillStyle = grad;

                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);

            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(80, 80);
            tex.encoding = THREE.sRGBEncoding;

            return tex;
        }


        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(2000, 2000),
            new THREE.MeshStandardMaterial({
                map: createSandTexture(),
                roughness: 1,
                metalness: 0
            })
        );

        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;

        scene.add(floor);


        // ---------- MATERIAL ----------

        const matBuilding = [
            0x6b6455,
            0x5a5347,
            0x7a4a2e,
            0x554f42,
            0x8f3a2c,
            0x4d4438
        ].map(c =>
            new THREE.MeshStandardMaterial({
                color: c,
                roughness: 0.95,
                metalness: 0.02
            })
        );

        const matRubble =
            new THREE.MeshStandardMaterial({
                color: 0x453f34,
                roughness: 1
            });

        const matConcreteHole =
            new THREE.MeshStandardMaterial({
                color: 0x2e2a24,
                roughness: 1
            });

        const matSandbag =
            new THREE.MeshStandardMaterial({
                color: 0x9c8656,
                roughness: 1
            });

        const matMetal =
            new THREE.MeshStandardMaterial({
                color: 0x3a3a3a,
                roughness: 0.6,
                metalness: 0.4
            });

        const matMetalRust =
            new THREE.MeshStandardMaterial({
                color: 0x6b3a20,
                roughness: 0.8,
                metalness: 0.2
            });


        function addShadowMesh(mesh) {

            mesh.castShadow = true;
            mesh.receiveShadow = true;

            return mesh;
        }


        // ---------- BYGGNADER / RUINER ----------

        function buildRuin(x, z) {

            const group = new THREE.Group();

            const w = 7 + Math.random() * 6;
            const h = 8 + Math.random() * 12;
            const d = 7 + Math.random() * 6;

            const mat =
                matBuilding[
                    Math.floor(Math.random() * matBuilding.length)
                ];

            const dmg = Math.random();


            if (dmg > 0.55) {

                const wall = addShadowMesh(
                    new THREE.Mesh(
                        new THREE.BoxGeometry(w, h, d),
                        mat
                    )
                );

                wall.position.y = h / 2;

                group.add(wall);


                const holes =
                    2 + Math.floor(Math.random() * 3);

                for (let i = 0; i < holes; i++) {

                    const hs =
                        1.2 + Math.random() * 1.8;

                    const hole = new THREE.Mesh(
                        new THREE.BoxGeometry(
                            hs,
                            hs,
                            d + 0.4
                        ),
                        matConcreteHole
                    );

                    hole.position.set(
                        (Math.random() - 0.5) * (w - hs),
                        (Math.random() * 0.6 + 0.25) * h,
                        0
                    );

                    group.add(hole);
                }


                if (Math.random() > 0.5) {

                    const chunk = new THREE.Mesh(
                        new THREE.BoxGeometry(
                            w * 0.4,
                            h * 0.35,
                            d * 0.4
                        ),
                        mat
                    );

                    chunk.position.set(
                        w * 0.25,
                        h * 0.15,
                        d * 0.2
                    );

                    chunk.rotation.set(
                        0.3,
                        0.4,
                        0.2
                    );

                    group.add(chunk);
                }

            } else if (dmg > 0.25) {

                const wall = addShadowMesh(
                    new THREE.Mesh(
                        new THREE.BoxGeometry(
                            w,
                            h * 0.65,
                            d
                        ),
                        mat
                    )
                );

                wall.position.y =
                    (h * 0.65) / 2;

                group.add(wall);

                group.rotation.z =
                    (Math.random() - 0.5) * 0.35;

                group.rotation.x =
                    (Math.random() - 0.5) * 0.08;

            } else {

                for (let j = 0; j < 4; j++) {

                    const rubble = new THREE.Mesh(
                        new THREE.BoxGeometry(
                            w * (0.3 + Math.random() * 0.35),
                            1.2 + Math.random() * 2,
                            d * (0.3 + Math.random() * 0.35)
                        ),
                        matRubble
                    );

                    rubble.position.set(
                        (Math.random() - 0.5) * w,
                        0.8,
                        (Math.random() - 0.5) * d
                    );

                    rubble.rotation.y =
                        Math.random() * Math.PI;

                    group.add(rubble);
                }


                for (
                    let j = 0;
                    j < 2 + Math.floor(Math.random() * 2);
                    j++
                ) {

                    const beam = new THREE.Mesh(
                        new THREE.CylinderGeometry(
                            0.12,
                            0.12,
                            3 + Math.random() * 3,
                            6
                        ),
                        matMetal
                    );

                    beam.position.set(
                        (Math.random() - 0.5) * w,
                        1.5,
                        (Math.random() - 0.5) * d
                    );

                    beam.rotation.set(
                        Math.random() * 0.8,
                        0,
                        Math.random() * 0.8
                    );

                    group.add(beam);
                }
            }


            // ---------- DÖRRAR OCH FÖNSTER ----------

            if (Math.random() > 0.25) {

                const door = new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.5,
                        3,
                        0.18
                    ),
                    matConcreteHole
                );

                door.position.set(
                    0,
                    1.5,
                    d / 2 + 0.1
                );

                group.add(door);
            }


            if (Math.random() > 0.2) {

                const windowCount =
                    2 + Math.floor(Math.random() * 3);

                for (let i = 0; i < windowCount; i++) {

                    const windowMesh = new THREE.Mesh(
                        new THREE.BoxGeometry(
                            1.4,
                            1.3,
                            0.15
                        ),
                        matConcreteHole
                    );

                    windowMesh.position.set(
                        -w / 2 +
                        1.5 +
                        i * Math.max(1.8, (w - 3) / windowCount),
                        3 +
                        Math.random() * Math.max(1, h * 0.35),
                        d / 2 + 0.08
                    );

                    group.add(windowMesh);
                }
            }


            // ---------- EXTRA DETALJER ----------

            if (Math.random() > 0.6) {

                for (
                    let i = 0;
                    i < 2 + Math.floor(Math.random() * 3);
                    i++
                ) {

                    const bag = new THREE.Mesh(
                        new THREE.SphereGeometry(
                            0.5,
                            6,
                            5
                        ),
                        matSandbag
                    );

                    bag.scale.set(
                        1,
                        0.6,
                        0.7
                    );

                    bag.position.set(
                        w / 2 + 0.5 + Math.random() * 1.5,
                        0.3,
                        (Math.random() - 0.5) * d
                    );

                    group.add(bag);
                }
            }


            if (Math.random() > 0.55) {

                const box = new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.2,
                        0.8,
                        1.2
                    ),
                    matRubble
                );

                box.position.set(
                    -w / 2 - 0.7,
                    0.4,
                    d / 2 + 0.7
                );

                group.add(box);
            }


            if (Math.random() > 0.75) {

                const barrel = new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        0.5,
                        0.5,
                        1.3,
                        10
                    ),
                    Math.random() > 0.5
                        ? matMetalRust
                        : matMetal
                );

                barrel.position.set(
                    -w / 2 - 1 - Math.random(),
                    0.65,
                    (Math.random() - 0.5) * d
                );

                barrel.rotation.z =
                    Math.random() > 0.8
                        ? Math.PI / 2
                        : 0;

                group.add(barrel);
            }


            group.position.set(x, 0, z);

            // Endast själva husets grundyta används som collision.
            // Dekorativa dörrar, fönster, lådor osv skapar därför
            // inte längre osynliga barriärer.
            group.userData.colliderWidth = w;
            group.userData.colliderDepth = d;

            return group;
        }


        // ---------- TRAPPOR ----------

        function buildStairs(x, z) {

            const group = new THREE.Group();

            const steps = 7;

            for (let i = 0; i < steps; i++) {

                const step = new THREE.Mesh(
                    new THREE.BoxGeometry(
                        4,
                        0.45,
                        1.2
                    ),
                    matBuilding[2]
                );

                step.castShadow = true;
                step.receiveShadow = true;

                step.position.set(
                    0,
                    0.225 + i * 0.45,
                    i * 1.05
                );

                group.add(step);
            }

            group.position.set(x, 0, z);

            return group;
        }


        // ---------- BOMBKRATRAR ----------

        function buildCrater(x, z) {

            const r = 2 + Math.random() * 3;

            const ring = new THREE.Mesh(
                new THREE.RingGeometry(
                    r * 0.4,
                    r,
                    16
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x2e2a20,
                    roughness: 1,
                    side: THREE.DoubleSide
                })
            );

            ring.rotation.x = -Math.PI / 2;

            ring.position.set(
                x,
                0.02,
                z
            );

            ring.receiveShadow = true;

            return ring;
        }


        // ---------- ELSTOLPAR ----------

        function buildPylon(x, z) {

            const group = new THREE.Group();


            const pole = addShadowMesh(
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        0.15,
                        0.2,
                        9,
                        6
                    ),
                    matMetalRust
                )
            );

            pole.position.y = 4.5;

            pole.rotation.z =
                (Math.random() - 0.5) * 0.25;

            group.add(pole);


            const crossbar = addShadowMesh(
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        3,
                        0.15,
                        0.15
                    ),
                    matMetal
                )
            );

            crossbar.position.y = 8.5;

            group.add(crossbar);


            group.position.set(x, 0, z);

            return group;
        }


        // ---------- KOLLISIONER + OSYNLIG GRÄNS ----------

        const usedSpots = [];

        const buildingColliders = [];

        const playerRadius = 0.1;

        const WORLD_MIN = -100;
        const WORLD_MAX = 100;


        function canMoveTo(x, z) {

            if (
                x < WORLD_MIN + playerRadius ||
                x > WORLD_MAX - playerRadius ||
                z < WORLD_MIN + playerRadius ||
                z > WORLD_MAX - playerRadius
            ) {
                return false;
            }


            // Bara riktiga huskroppar används som collision.
            // Inga Box3 från dekorativa objekt eller trappan.
            for (const box of buildingColliders) {

                if (
                    x > box.min.x - playerRadius &&
                    x < box.max.x + playerRadius &&
                    z > box.min.z - playerRadius &&
                    z < box.max.z + playerRadius
                ) {
                    return false;
                }
            }

            return true;
        }


        function spotFree(x, z, minDist) {

            if (
                Math.abs(x) < 12 &&
                Math.abs(z) < 12
            ) {
                return false;
            }


            for (const s of usedSpots) {

                if (
                    Math.hypot(
                        s.x - x,
                        s.z - z
                    ) < minDist
                ) {
                    return false;
                }
            }

            return true;
        }


        // ---------- FLER HUS ÖVER HELA KARTAN ----------

        for (let i = 0; i < 100; i++) {

            let x, z, tries = 0;

            do {

                x =
                    (Math.random() - 0.5) * 200;

                z =
                    (Math.random() - 0.5) * 200;

                tries++;

            } while (
                !spotFree(x, z, 7) &&
                tries < 30
            );


            if (tries >= 30) continue;


            usedSpots.push({
                x,
                z
            });


            const ruin =
                buildRuin(x, z);

            scene.add(ruin);

            // Collision baserad endast på husets verkliga footprint.
            buildingColliders.push(
                new THREE.Box3(
                    new THREE.Vector3(
                        x - ruin.userData.colliderWidth / 2,
                        0,
                        z - ruin.userData.colliderDepth / 2
                    ),
                    new THREE.Vector3(
                        x + ruin.userData.colliderWidth / 2,
                        20,
                        z + ruin.userData.colliderDepth / 2
                    )
                )
            );


            if (Math.random() > 0.65) {

                scene.add(
                    buildCrater(
                        x + (Math.random() - 0.5) * 6,
                        z + (Math.random() - 0.5) * 6
                    )
                );
            }
        }


        // ---------- TÄT KRIGSBY ----------

        const villageSpots = [

            [-55, -55], [-40, -55], [-25, -55], [-10, -55],
            [10, -55], [25, -55], [40, -55], [55, -55],

            [-55, -38], [-40, -38], [-25, -38], [-10, -38],
            [10, -38], [25, -38], [40, -38], [55, -38],

            [-55, -20], [-40, -20], [-25, -20], [-10, -20],
            [10, -20], [25, -20], [40, -20], [55, -20],

            [-55, 0], [-40, 0], [-25, 0], [25, 0],
            [40, 0], [55, 0],

            [-55, 20], [-40, 20], [-25, 20], [-10, 20],
            [10, 20], [25, 20], [40, 20], [55, 20],

            [-55, 38], [-40, 38], [-25, 38], [-10, 38],
            [10, 38], [25, 38], [40, 38], [55, 38],

            [-55, 55], [-40, 55], [-25, 55], [-10, 55],
            [10, 55], [25, 55], [40, 55], [55, 55]
        ];


        for (const spot of villageSpots) {

            const x =
                spot[0] +
                (Math.random() - 0.5) * 3;

            const z =
                spot[1] +
                (Math.random() - 0.5) * 3;


            if (spotFree(x, z, 6.5)) {

                usedSpots.push({
                    x,
                    z
                });


                const ruin =
                    buildRuin(x, z);

                scene.add(ruin);

                buildingColliders.push(
                    new THREE.Box3(
                        new THREE.Vector3(
                            x - ruin.userData.colliderWidth / 2,
                            0,
                            z - ruin.userData.colliderDepth / 2
                        ),
                        new THREE.Vector3(
                            x + ruin.userData.colliderWidth / 2,
                            20,
                            z + ruin.userData.colliderDepth / 2
                        )
                    )
                );
            }
        }


        // ---------- TRAPPA VID KRIGSBYN ----------

        const stairs =
            buildStairs(0, 55);

        scene.add(stairs);

        // Trappan är INTE en osynlig vägg.
        // Den får därför ingen vanlig Box3-kollision.


        // ---------- HUS UTANFÖR GRÄNSEN ----------

        const outsideHouses = [

            [-115, -75], [-115, -50], [-115, -25], [-115, 0],
            [-115, 25], [-115, 50], [-115, 75],

            [115, -75], [115, -50], [115, -25], [115, 0],
            [115, 25], [115, 50], [115, 75],

            [-75, -115], [-50, -115], [-25, -115], [0, -115],
            [25, -115], [50, -115], [75, -115],

            [-75, 115], [-50, 115], [-25, 115], [0, 115],
            [25, 115], [50, 115], [75, 115]
        ];


        for (const spot of outsideHouses) {

            const x =
                spot[0] +
                (Math.random() - 0.5) * 5;

            const z =
                spot[1] +
                (Math.random() - 0.5) * 5;


            scene.add(
                buildRuin(x, z)
            );
        }


        // ---------- ELSTOLPAR ----------

        for (let i = 0; i < 6; i++) {

            const x =
                (Math.random() - 0.5) * 190;

            const z =
                (Math.random() - 0.5) * 190;


            if (spotFree(x, z, 6)) {

                scene.add(
                    buildPylon(x, z)
                );
            }
        }


        // ---------- FRISTÅENDE KRATRAR ----------

        for (let i = 0; i < 10; i++) {

            scene.add(
                buildCrater(
                    (Math.random() - 0.5) * 210,
                    (Math.random() - 0.5) * 210
                )
            );
        }


        // ---------- DAMMPARTIKLAR ----------

        // Färre partiklar ger bättre FPS.
        const dustCount = 180;

        const dustGeo =
            new THREE.BufferGeometry();

        const dustPos =
            new Float32Array(
                dustCount * 3
            );


        for (let i = 0; i < dustCount; i++) {

            dustPos[i * 3] =
                (Math.random() - 0.5) * 220;

            dustPos[i * 3 + 1] =
                Math.random() * 20;

            dustPos[i * 3 + 2] =
                (Math.random() - 0.5) * 220;
        }


        dustGeo.setAttribute(
            'position',
            new THREE.BufferAttribute(
                dustPos,
                3
            )
        );


        const dustMat =
            new THREE.PointsMaterial({
                color: 0xe8d9b5,
                size: 0.18,
                transparent: true,
                opacity: 0.5,
                depthWrite: false
            });


        const dust =
            new THREE.Points(
                dustGeo,
                dustMat
            );

        scene.add(dust);


        // ---------- KONTROLLER ----------

        let cameraYAngle = 0;
        let cameraXAngle = 0;
        let isMouseLocked = false;


        const startOverlay =
            document.getElementById(
                'start-overlay'
            );

        const crosshair =
            document.getElementById(
                'crosshair'
            );

        const loading =
            document.getElementById(
                'loading'
            );


        loading.style.display = 'none';

        startOverlay.style.display = 'flex';


        startOverlay.addEventListener(
            'click',
            () => {
                renderer.domElement.requestPointerLock();
            }
        );


        document.addEventListener(
            'pointerlockchange',
            () => {

                isMouseLocked =
                    document.pointerLockElement ===
                    renderer.domElement;


                startOverlay.style.display =
                    isMouseLocked
                        ? 'none'
                        : 'flex';


                crosshair.style.display =
                    isMouseLocked
                        ? 'block'
                        : 'none';
            }
        );


        document.addEventListener(
            'mousemove',
            (e) => {

                if (isMouseLocked) {

                    cameraYAngle -=
                        e.movementX * 0.002;

                    cameraXAngle -=
                        e.movementY * 0.002;


                    cameraXAngle =
                        Math.max(
                            -Math.PI / 2.2,
                            Math.min(
                                Math.PI / 2.2,
                                cameraXAngle
                            )
                        );
                }
            }
        );


        const keys = {
            w: false,
            a: false,
            s: false,
            d: false,
            space: false
        };


        // ---------- FÖRBÄTTRAD MOVEMENT + HOPP ----------

        let velocityY = 0;
        let isGrounded = true;

        let velocityX = 0;
        let velocityZ = 0;

        const acceleration = 65;
        const friction = 18;
        const maxSpeed = 14;

        const gravity = 30;
        const jumpSpeed = 11;

        let lastTime =
            performance.now();


        document.addEventListener(
            'keydown',
            (e) => {

                if (e.code === 'KeyW')
                    keys.w = true;

                if (e.code === 'KeyA')
                    keys.a = true;

                if (e.code === 'KeyS')
                    keys.s = true;

                if (e.code === 'KeyD')
                    keys.d = true;

                if (e.code === 'Space')
                    keys.space = true;
            }
        );


        document.addEventListener(
            'keyup',
            (e) => {

                if (e.code === 'KeyW')
                    keys.w = false;

                if (e.code === 'KeyA')
                    keys.a = false;

                if (e.code === 'KeyS')
                    keys.s = false;

                if (e.code === 'KeyD')
                    keys.d = false;

                if (e.code === 'Space')
                    keys.space = false;
            }
        );


        // ---------- ANIMATIONSLOOP ----------

        function animate() {

            requestAnimationFrame(
                animate
            );


            const timeNow =
                performance.now();


            const delta =
                Math.min(
                    (timeNow - lastTime) / 1000,
                    0.05
                );


            lastTime = timeNow;


            if (isMouseLocked) {

                let moveX = 0;
                let moveZ = 0;


                if (keys.w) {

                    moveX +=
                        Math.sin(cameraYAngle);

                    moveZ +=
                        Math.cos(cameraYAngle);
                }


                if (keys.s) {

                    moveX -=
                        Math.sin(cameraYAngle);

                    moveZ -=
                        Math.cos(cameraYAngle);
                }


                if (keys.a) {

                    moveX +=
                        Math.cos(cameraYAngle);

                    moveZ -=
                        Math.sin(cameraYAngle);
                }


                if (keys.d) {

                    moveX -=
                        Math.cos(cameraYAngle);

                    moveZ +=
                        Math.sin(cameraYAngle);
                }


                const inputLength =
                    Math.hypot(moveX, moveZ);


                if (inputLength > 0) {

                    moveX /= inputLength;
                    moveZ /= inputLength;


                    velocityX +=
                        moveX * acceleration * delta;

                    velocityZ +=
                        moveZ * acceleration * delta;

                } else {

                    const speed =
                        Math.hypot(
                            velocityX,
                            velocityZ
                        );

                    if (speed > 0) {

                        const drop =
                            friction * delta;

                        const newSpeed =
                            Math.max(
                                0,
                                speed - drop
                            );

                        const scale =
                            speed > 0
                                ? newSpeed / speed
                                : 0;

                        velocityX *= scale;
                        velocityZ *= scale;
                    }
                }


                const horizontalSpeed =
                    Math.hypot(
                        velocityX,
                        velocityZ
                    );


                if (
                    horizontalSpeed >
                    maxSpeed
                ) {

                    const scale =
                        maxSpeed /
                        horizontalSpeed;

                    velocityX *= scale;
                    velocityZ *= scale;
                }


                // ---------- X-KOLLISION ----------

                const nextX =
                    camera.position.x +
                    velocityX * delta;


                if (
                    canMoveTo(
                        nextX,
                        camera.position.z
                    )
                ) {

                    camera.position.x =
                        nextX;

                } else {

                    velocityX = 0;
                }


                // ---------- Z-KOLLISION ----------

                const nextZ =
                    camera.position.z +
                    velocityZ * delta;


                if (
                    canMoveTo(
                        camera.position.x,
                        nextZ
                    )
                ) {

                    camera.position.z =
                        nextZ;

                } else {

                    velocityZ = 0;
                }


                // ---------- HOPP ----------

                if (
                    keys.space &&
                    isGrounded
                ) {

                    velocityY =
                        jumpSpeed;

                    isGrounded =
                        false;
                }


                velocityY -=
                    gravity * delta;


                camera.position.y +=
                    velocityY * delta;


                if (
                    camera.position.y <= 2
                ) {

                    camera.position.y = 2;

                    velocityY = 0;

                    isGrounded = true;
                }
            }


            // ---------- DAMM ----------

            const pos =
                dustGeo.attributes.position;


            for (let i = 0; i < dustCount; i++) {

                pos.array[i * 3] +=
                    0.15 * delta * 10;

                pos.array[i * 3 + 1] -=
                    0.02 * delta * 10;


                if (
                    pos.array[i * 3 + 1] < 0
                ) {

                    pos.array[i * 3 + 1] = 18;
                }


                if (
                    pos.array[i * 3] >
                    camera.position.x + 100
                ) {

                    pos.array[i * 3] =
                        camera.position.x - 100;
                }
            }


            pos.needsUpdate = true;


            // ---------- KAMERA ----------

            const target =
                new THREE.Vector3();


            target.x =
                camera.position.x +
                Math.sin(cameraYAngle) *
                Math.cos(cameraXAngle);


            target.z =
                camera.position.z +
                Math.cos(cameraYAngle) *
                Math.cos(cameraXAngle);


            target.y =
                camera.position.y +
                Math.sin(cameraXAngle);


            camera.lookAt(target);


            renderer.render(
                scene,
                camera
            );
        }


        // ---------- RESIZE ----------

        window.addEventListener(
            'resize',
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

                renderer.setPixelRatio(
                    Math.min(window.devicePixelRatio, 1.5)
                );
            }
        );


        animate();

    </script>

</body>
</html>
