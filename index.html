<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt 3D FPS Spel</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; background: white;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.8; z-index: 10; display: none;
        }
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        #start-button {
            padding: 20px 40px; font-size: 24px; font-weight: bold; background: #ff4500;
            color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #start-button:hover { background: #ff5722; }
    </style>
</head>
<body>

    <!-- Startskärm som tvingar webbläsaren att uppdatera -->
    <div id="start-overlay">
        <button id="start-button">STARTA SPELET (KLICKA HÄR)</button>
    </div>

    <!-- Sikte i mitten -->
    <div id="crosshair"></div>

    <!-- Stabil och säker JavaScript-länk för 3D-motorn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Inställningar för 3D-scen och kamera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Garanterat ljusblå himmel

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0); // Startar i ögonhöjd (2 meter upp från marken)

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Allmänt ljus i världen
        const light = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(light);

        // 2. Det gröna gräset (Marken)
        const floorGeo = new THREE.PlaneGeometry(2000, 2000);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x2e8b57 }); // Garanterat grönt gräs
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 3. Stora färgade pelare så du ser när du går
        const boxGeo = new THREE.BoxGeometry(4, 10, 4);
        const colors = [0xff0000, 0xffff00, 0x0000ff, 0xff00ff]; // Röd, Gul, Blå, Lila

        for (let i = 0; i < 50; i++) {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const boxMat = new THREE.MeshBasicMaterial({ color: randomColor });
            const box = new THREE.Mesh(boxGeo, boxMat);
            
            box.position.x = (Math.random() - 0.5) * 160;
            box.position.z = (Math.random() - 0.5) * 160;
            box.position.y = 5; // Placerade perfekt stående på gräset
            
            // Rensa startytan så inget block blockerar kameran vid start
            if (Math.abs(box.position.x) < 8 && Math.abs(box.position.z) < 8) {
                box.position.z -= 25;
            }
            scene.add(box);
        }

        // 4. Hantering av mus och låsning
        let cameraYAngle = 0; 
        let cameraXAngle = 0; 
        let isMouseLocked = false;

        const startOverlay = document.getElementById('start-overlay');
        const startButton = document.getElementById('start-button');
        const crosshair = document.getElementById('crosshair');

        startButton.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === renderer.domElement) {
                isMouseLocked = true;
                startOverlay.style.display = 'none';
                crosshair.style.display = 'block';
            } else {
                isMouseLocked = false;
                startOverlay.style.display = 'flex';
                crosshair.style.display = 'none';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isMouseLocked) {
                cameraYAngle -= e.movementX * 0.002;
                cameraXAngle -= e.movementY * 0.002;
                cameraXAngle = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, cameraXAngle)); // Spärr för tak/mark
            }
        });

        // 5. Tangentbords-inputs
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0;
        let isGrounded = true;
        let lastTime = performance.now();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // 6. Spelslingan (Rörelse & Fysik)
        function animate() {
            requestAnimationFrame(animate);

            const timeNow = performance.now();
            const delta = Math.min((timeNow - lastTime) / 1000, 0.1);
            lastTime = timeNow;

            if (isMouseLocked) {
                let moveX = 0;
                let moveZ = 0;

                if (keys.w) { moveX += Math.sin(cameraYAngle); moveZ += Math.cos(cameraYAngle); }
                if (keys.s) { moveX -= Math.sin(cameraYAngle); moveZ -= Math.cos(cameraYAngle); }
                if (keys.a) { moveX += Math.cos(cameraYAngle); moveZ -= Math.sin(cameraYAngle); }
                if (keys.d) { moveX -= Math.cos(cameraYAngle); moveZ += Math.sin(cameraYAngle); }

                const speed = 16; // Gånghastighet
                camera.position.x += moveX * speed * delta;
                camera.position.z += moveZ * speed * delta;

                // Tyngdkraft och Hoppstyrka
                velocityY -= 28 * delta; 
                camera.position.y += velocityY * delta;

                if (keys.space && isGrounded) {
                    velocityY = 11;
                    isGrounded = false;
                }

                // Spärr så man inte faller igenom det gröna gräset
                if (camera.position.y < 2) {
                    camera.position.y = 2;
                    velocityY = 0;
                    isGrounded = true;
                }
            }

            // Uppdatera vart kameran pekar utifrån musvinklarna
            const target = new THREE.Vector3();
            target.x = camera.position.x + Math.sin(cameraYAngle) * Math.cos(cameraXAngle);
            target.z = camera.position.z + Math.cos(cameraYAngle) * Math.cos(cameraXAngle);
            target.y = camera.position.y + Math.sin(cameraXAngle);
            camera.lookAt(target);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
