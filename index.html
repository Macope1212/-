<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desert War Zone - Perfekt FPS Styrning</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: white; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.8; z-index: 10; display: none;
        }
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center;
            align-items: center; z-index: 100; color: white; cursor: pointer;
        }
        .start-text {
            padding: 20px 40px; font-size: 24px; font-weight: bold; background: #d35400;
            border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div class="start-text">STARTA SPELET (FIXAD STYRNING)</div>
    </div>
    <div id="crosshair"></div>

    <!-- Stabil spelmotor som skoldatorn släpper igenom -->
    <script src="https://unpkg.com"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd5a97a); 
        scene.fog = new THREE.FogExp2(0xd5a97a, 0.025); // Sandstorm/Krigsdimma

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0); // Startar i ögonhöjd

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.AmbientLight(0xfff0e0, 1.0);
        scene.add(light);

        // Ökensand (Marken)
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(2000, 2000), 
            new THREE.MeshBasicMaterial({ color: 0xc29d70 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Byggnader (Hela, trasiga och rasmassor i krigszonen)
        const colors = [0x555d50, 0x3e3a36, 0x7b3f00, 0x4a4135, 0x8b0000]; 
        for (let i = 0; i < 45; i++) {
            const x = (Math.random() - 0.5) * 160;
            const z = (Math.random() - 0.5) * 160;
            if (Math.abs(x) < 12 && Math.abs(z) < 12) continue;

            const w = 7 + Math.random() * 6;
            const h = 8 + Math.random() * 12;
            const d = 7 + Math.random() * 6;
            const col = colors[Math.floor(Math.random() * colors.length)];

            const bGroup = new THREE.Group();
            const dmg = Math.random();
            const mat = new THREE.MeshBasicMaterial({ color: col });

            if (dmg > 0.4) {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                wall.position.y = h / 2;
                bGroup.add(wall);
            } else if (dmg > 0.15) {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h * 0.7, d), mat);
                wall.position.y = (h * 0.7) / 2;
                bGroup.add(wall);
                bGroup.rotation.z = (Math.random() - 0.5) * 0.3; // Lutande bombat hus
            } else {
                for (let j = 0; j < 3; j++) {
                    const rubble = new THREE.Mesh(new THREE.BoxGeometry(w * 0.6, 2, d * 0.6), new THREE.MeshBasicMaterial({ color: 0x3e3a36 }));
                    rubble.position.set((Math.random() - 0.5) * 4, 1, (Math.random() - 0.5) * 4);
                    bGroup.add(rubble);
                }
            }
            bGroup.position.set(x, 0, z);
            scene.add(bGroup);
        }

        // Muslåsning och kamerainställningar
        let cameraYAngle = 0, cameraXAngle = 0, isMouseLocked = false;
        const startOverlay = document.getElementById('start-overlay');
        const crosshair = document.getElementById('crosshair');

        startOverlay.addEventListener('click', () => { 
            renderer.domElement.requestPointerLock(); 
        });

        document.addEventListener('pointerlockchange', () => {
            isMouseLocked = (document.pointerLockElement === renderer.domElement);
            startOverlay.style.display = isMouseLocked ? 'none' : 'flex';
            crosshair.style.display = isMouseLocked ? 'block' : 'none';
        });

        // Musrörelse för att titta runt (Helt fristående från gångriktningen)
        document.addEventListener('mousemove', (e) => {
            if (isMouseLocked) {
                cameraYAngle -= e.movementX * 0.002;
                cameraXAngle -= e.movementY * 0.002;
                
                // Spärr så man inte kan slå runt kameran uppochner
                cameraXAngle = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, cameraXAngle));
            }
        });

        // Knapptryckningar
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0, isGrounded = true, lastTime = performance.now();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true; if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true; if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false; if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false; if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // Spelslingan med fixad rörelse-matematik
        function animate() {
            requestAnimationFrame(animate);
            const timeNow = performance.now();
            const delta = Math.min((timeNow - lastTime) / 1000, 0.1);
            lastTime = timeNow;

            // Nollställ kamerans rotation inför rörelseberäkningen för att undvika "fucked" kamera
            camera.rotation.set(0, 0, 0);

            if (isMouseLocked) {
                const speed = 16; // Smidig hastighet

                // ÄKTA FPS-RÖRELSE: Flytta kameran längs dess lokala axlar baserat på W,A,S,D
                // Vi roterar bara spelaren runt Y-axeln (vänster/höger) när vi går så man inte flyger upp i luften
                camera.rotation.y = cameraYAngle;

                if (keys.w) camera.translateZ(-speed * delta);
                if (keys.s) camera.translateZ(speed * delta);
                if (keys.a) camera.translateX(-speed * delta);
                if (keys.d) camera.translateX(speed * delta);

                // Fysik för gravitation och hopp (Mellanslag)
                velocityY -= 28 * delta; 
                camera.position.y += velocityY * delta;

                if (keys.space && isGrounded) { 
                    velocityY = 11; 
                    isGrounded = false; 
                }
                
                // Håll spelaren i fast höjd på marken (2 meter upp)
                if (camera.position.y < 2) { 
                    camera.position.y = 2; 
                    velocityY = 0; 
                    isGrounded = true; 
                }
            }

            // Applicera den slutgiltiga kameravinkeln (både höger/vänster och upp/ner)
            camera.rotation.set(0, 0, 0); // Återställ först
            camera.rotation.y = cameraYAngle;
            camera.rotation.x = cameraXAngle;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
