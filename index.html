<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt 3D FPS Spel med Byggnader</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; font-family: sans-serif; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; background: white;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.8; z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Sikte i mitten av skärmen -->
    <div id="crosshair"></div>

    <!-- Stabil basversion av Three.js -->
    <script src="https://cloudflare.com"></script>

    <script>
        // 1. Starta 3D-världen och kameran i ögonhöjd
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Blå himmel

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0); // Startar i ögonhöjd (2 meter upp från marken)

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Allmänt ljus som lyser upp världen och alla byggnader direkt
        const light = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(light);

        // 2. Det gröna gräset (Marken)
        const floorGeo = new THREE.PlaneGeometry(2000, 2000);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x2e8b57 }); // Garanterat stabilt grönt gräs
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 3. SKAPA FINA BYGGNADER
        // Funktion för att bygga ett hus med väggar, tak och dörr
        function createBuilding(x, z, width, height, depth, wallColor, roofColor) {
            const buildingGroup = new THREE.Group();

            // Själva huset (väggarna)
            const wallGeo = new THREE.BoxGeometry(width, height, depth);
            const wallMat = new THREE.MeshBasicMaterial({ color: wallColor });
            const walls = new THREE.Mesh(wallGeo, wallMat);
            walls.position.y = height / 2; // Sätt huset på marken
            buildingGroup.add(walls);

            // Taket (Vi gör ett platt men snyggt takutsprång eller pyramidliknande block)
            const roofHeight = 2;
            const roofGeo = new THREE.ConeGeometry(Math.max(width, depth) * 0.7, roofHeight, 4);
            const roofMat = new THREE.MeshBasicMaterial({ color: roofColor });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = height + (roofHeight / 2);
            roof.rotation.y = Math.PI / 4; // Rotera taket så det passar fyrkantiga hus
            buildingGroup.add(roof);

            // En dörr på framsidan av huset (svart block)
            const doorGeo = new THREE.BoxGeometry(width * 0.2, height * 0.3, 0.1);
            const doorMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, (height * 0.3) / 2, (depth / 2) + 0.02);
            buildingGroup.add(door);

            // Placera ut hela huset på kartan
            buildingGroup.position.set(x, 0, z);
            scene.add(buildingGroup);
        }

        // Färger till husen
        const wallColors = [0xdd4b39, 0xf39c12, 0x3498db, 0x9b59b6, 0xbdc3c7]; // Röd, Orange, Blå, Lila, Grå
        const roofColors = [0x2c3e50, 0x7f8c8d, 0xc0392b, 0x111111]; // Mörka takfärger

        // Bygg 25 unika hus på slumpmässiga ställen
        for (let i = 0; i < 25; i++) {
            const x = (Math.random() - 0.5) * 160;
            const z = (Math.random() - 0.5) * 160;
            
            // Slumpa storleken på huset
            const w = 6 + Math.random() * 6;
            const h = 8 + Math.random() * 12; // Mellan 8 och 20 meter höga
            const d = 6 + Math.random() * 6;

            const wallColor = wallColors[Math.floor(Math.random() * wallColors.length)];
            const roofColor = roofColors[Math.floor(Math.random() * roofColors.length)];

            // Se till att husen inte byggs precis där spelaren startar (0,0)
            if (Math.abs(x) < 12 && Math.abs(z) < 12) {
                continue; 
            }

            createBuilding(x, z, w, h, d, wallColor, roofColor);
        }

        // Bygg några riktigt höga "skyskrapor" i bakgrunden
        for (let i = 0; i < 5; i++) {
            const x = (Math.random() - 0.5) * 250;
            const z = (Math.random() - 0.5) * 250;
            if (Math.abs(x) < 30 && Math.abs(z) < 30) continue;

            createBuilding(x, z, 10, 40, 10, 0x2c3e50, 0xf1c40f); // Blågrå skyskrapor med gult tak
        }


        // 4. Muskontroller (Klicka på skärmen för att låsa musen och titta runt)
        let cameraYAngle = 0; 
        let cameraXAngle = 0; 
        let isMouseLocked = false;

        document.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isMouseLocked = (document.pointerLockElement === renderer.domElement);
        });

        document.addEventListener('mousemove', (e) => {
            if (isMouseLocked) {
                cameraYAngle -= e.movementX * 0.002;
                cameraXAngle -= e.movementY * 0.002;
                cameraXAngle = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, cameraXAngle)); // Spärr för tak/mark
            }
        });

        // 5. Tangentbordskontroller för W, A, S, D och Hopp (Mellanslag)
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0;
        let isGrounded = true;
        let lastTime = performance.now();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // 6. Spelslingan (Hanterar fysik och rörelse)
        function animate() {
            requestAnimationFrame(animate);

            const timeNow = performance.now();
            const delta = Math.min((timeNow - lastTime) / 1000, 0.1);
            lastTime = timeNow;

            let moveX = 0;
            let moveZ = 0;

            // Räkna ut rörelseriktning utifrån vart du tittar
            if (keys.w) { moveX += Math.sin(cameraYAngle); moveZ += Math.cos(cameraYAngle); }
            if (keys.s) { moveX -= Math.sin(cameraYAngle); moveZ -= Math.cos(cameraYAngle); }
            if (keys.a) { moveX += Math.cos(cameraYAngle); moveZ -= Math.sin(cameraYAngle); }
            if (keys.d) { moveX -= Math.cos(cameraYAngle); moveZ += Math.sin(cameraYAngle); }

            // Flytta kameran (Dig)
            const speed = 14;
            if (moveX !== 0 || moveZ !== 0) {
                camera.position.x += moveX * speed * delta;
                camera.position.z += moveZ * speed * delta;
            }

            // Gravitation och Hoppstyrka
            velocityY -= 24 * delta; 
            camera.position.y += velocityY * delta;

            if (keys.space && isGrounded) {
                velocityY = 11; // Ger dig ett bra och högt hopp
                isGrounded = false;
            }

            // Hindra spelaren från att falla igenom gräset (ögonhöjd = 2 meter)
            if (camera.position.y < 2) {
                camera.position.y = 2;
                velocityY = 0;
                isGrounded = true;
            }

            // Uppdatera kamerans blick utifrån musrörelsen
            const target = new THREE.Vector3();
            target.x = camera.position.x + Math.sin(cameraYAngle) * Math.cos(cameraXAngle);
            target.z = camera.position.z + Math.cos(cameraYAngle) * Math.cos(cameraXAngle);
            target.y = camera.position.y + Math.sin(cameraXAngle);
            camera.lookAt(target);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
