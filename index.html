<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desert War Zone</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: white; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.8; z-index: 10; display: none;
        }
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center;
            align-items: center; z-index: 100; color: white; cursor: pointer;
        }
        .start-text {
            padding: 20px 40px; font-size: 24px; font-weight: bold; background: #d35400;
            border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div class="start-text">STARTA ÖKENKRIGET (KLICKA HÄR)</div>
    </div>
    <div id="crosshair"></div>

    <!-- Säkert och stabilt 3D-bibliotek -->
    <script src="https://cloudflare.com"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd5a97a); // Sandfärgad himmel
        scene.fog = new THREE.FogExp2(0xd5a97a, 0.025); // Tät sandstorm/krigsdimma

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0); // Spelaren startar i ögonhöjd

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Kraschsäker sandmark (MeshBasicMaterial)
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(2000, 2000), 
            new THREE.MeshBasicMaterial({ color: 0xc29d70 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Krigshärjade byggnader (Militärgrön, Aska, Rost, Lera, Mörkröd)
        const colors = [0x555d50, 0x3e3a36, 0x7b3f00, 0x4a4135, 0x8b0000]; 
        for (let i = 0; i < 45; i++) {
            const x = (Math.random() - 0.5) * 160;
            const z = (Math.random() - 0.5) * 160;
            if (Math.abs(x) < 12 && Math.abs(z) < 12) continue; // Håll startytan fri

            const w = 7 + Math.random() * 6;
            const h = 8 + Math.random() * 12;
            const d = 7 + Math.random() * 6;
            const col = colors[Math.floor(Math.random() * colors.length)];

            const bGroup = new THREE.Group();
            const dmg = Math.random();
            const mat = new THREE.MeshBasicMaterial({ color: col });

            if (dmg > 0.4) {
                // Hela byggnader
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                wall.position.y = h / 2;
                bGroup.add(wall);
            } else if (dmg > 0.15) {
                // Sönderbombade lutande hus
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h * 0.7, d), mat);
                wall.position.y = (h * 0.7) / 2;
                bGroup.add(wall);
                bGroup.rotation.z = (Math.random() - 0.5) * 0.3;
            } else {
                // Ruinhögar/Rasmassor på marken
                for (let j = 0; j < 3; j++) {
                    const rubble = new THREE.Mesh(
                        new THREE.BoxGeometry(w * 0.6, 2, d * 0.6), 
                        new THREE.MeshBasicMaterial({ color: 0x3e3a36 })
                    );
                    rubble.position.set((Math.random() - 0.5) * 4, 1, (Math.random() - 0.5) * 4);
                    bGroup.add(rubble);
                }
            }
            bGroup.position.set(x, 0, z);
            scene.add(bGroup);
        }

        // Muslåsning och skärmklick
        let cameraYAngle = 0, cameraXAngle = 0, isMouseLocked = false;
        const startOverlay = document.getElementById('start-overlay');
        const crosshair = document.getElementById('crosshair');

        startOverlay.addEventListener('click', () => { 
            renderer.domElement.requestPointerLock(); 
        });

        document.addEventListener('pointerlockchange', () => {
            isMouseLocked = (document.pointerLockElement === renderer.domElement);
            startOverlay.style.display = isMouseLocked ? 'none' : 'flex';
            crosshair.style.display = isMouseLocked ? 'block' : 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (isMouseLocked) {
                cameraYAngle -= e.movementX * 0.002;
                cameraXAngle -= e.movementY * 0.002;
                cameraXAngle = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, cameraXAngle));
            }
        });

        // Tangentbordskontroller (W, A, S, D + Mellanslag)
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0, isGrounded = true, lastTime = performance.now();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true; if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true; if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false; if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false; if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // Spelslingan
        function animate() {
            requestAnimationFrame(animate);
            const timeNow = performance.now();
            const delta = Math.min((timeNow - lastTime) / 1000, 0.1);
            lastTime = timeNow;

            if (isMouseLocked) {
                let moveX = 0, moveZ = 0;
                if (keys.w) { moveX += Math.sin(cameraYAngle); moveZ += Math.cos(cameraYAngle); }
                if (keys.s) { moveX -= Math.sin(cameraYAngle); moveZ -= Math.cos(cameraYAngle); }
                if (keys.a) { moveX += Math.cos(cameraYAngle); moveZ -= Math.sin(cameraYAngle); }
                if (keys.d) { moveX -= Math.cos(cameraYAngle); moveZ += Math.sin(cameraYAngle); }

                camera.position.x += moveX * 16 * delta;
                camera.position.z += moveZ * 16 * delta;
                
                // Tyngdkraft och Hopp
                velocityY -= 28 * delta; 
                camera.position.y += velocityY * delta;

                if (keys.space && isGrounded) { velocityY = 11; isGrounded = false; }
                if (camera.position.y < 2) { camera.position.y = 2; velocityY = 0; isGrounded = true; }
            }

            const target = new THREE.Vector3();
            target.x = camera.position.x + Math.sin(cameraYAngle) * Math.cos(cameraXAngle);
            target.z = camera.position.z + Math.cos(cameraYAngle) * Math.cos(cameraXAngle);
            target.y = camera.position.y + Math.sin(cameraXAngle);
            camera.lookAt(target);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
