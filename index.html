<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desert War Zone - Unblocked</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #d5a97a; font-family: sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: white; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.8; display: none; z-index: 10;
        }
        #info-text {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #fff; font-size: 18px; font-weight: bold; pointer-events: none;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8); z-index: 5;
        }
    </style>
</head>
<body>

    <div id="info-text">KLICKA PÅ SKÄRMEN FÖR ATT STARTA (W,A,S,D = GÅ | SPACE = HOPPA)</div>
    <div id="crosshair"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const infoText = document.getElementById('info-text');
        const crosshair = document.getElementById('crosshair');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Spelarens variabler
        const player = { x: 0, y: 2, z: 0, yaw: 0, pitch: 0 };
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let isMouseLocked = false, velocityY = 0, isGrounded = true, lastTime = performance.now();

        // Skapa ökenbyggnader
        const buildings = [];
        const colors = ['#555d50', '#3e3a36', '#7b3f00', '#4a4135', '#8b0000']; 
        
        for (let i = 0; i < 45; i++) {
            const bx = (Math.random() - 0.5) * 160;
            const bz = (Math.random() - 0.5) * 160;
            // Håll startytan fri
            if (Math.abs(bx) < 15 && Math.abs(bz) < 15) continue;

            buildings.push({
                x: bx,
                z: bz,
                w: 6 + Math.random() * 6,
                h: 8 + Math.random() * 14,
                d: 6 + Math.random() * 6,
                color: colors[Math.floor(Math.random() * colors.length)],
                dmg: Math.random()
            });
        }

        // Lås muspekaren vid klick på skärmen
        canvas.addEventListener('click', () => { canvas.requestPointerLock(); });
        document.addEventListener('pointerlockchange', () => {
            isMouseLocked = (document.pointerLockElement === canvas);
            crosshair.style.display = isMouseLocked ? 'block' : 'none';
            infoText.style.display = isMouseLocked ? 'none' : 'block';
        });

        document.addEventListener('mousemove', (e) => {
            if (isMouseLocked) {
                player.yaw -= e.movementX * 0.0025;
                player.pitch -= e.movementY * 0.0025;
                // Spärr för att titta rakt upp/ner
                player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true; if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true; if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false; if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false; if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // 3D-projektion till din 2D-skärm
        function project(x, y, z) {
            let rx = x - player.x;
            let ry = y - player.y;
            let rz = z - player.z;

            // Rotera kamera (Yaw - höger/vänster)
            const cosY = Math.cos(-player.yaw), sinY = Math.sin(-player.yaw);
            const rotX = rx * cosY - rz * sinY;
            const rotZ = rx * sinY + rz * cosY;

            // Rotera kamera (Pitch - upp/ner)
            const cosX = Math.cos(-player.pitch), sinX = Math.sin(-player.pitch);
            const finalY = ry * cosX - rotZ * sinX;
            const finalZ = ry * sinX + rotZ * cosX;

            if (finalZ <= 0.5) return null; // Bakom kameran

            const fov = Math.min(canvas.width, canvas.height);
            return {
                x: (rotX / finalZ) * fov + canvas.width / 2,
                y: -(finalY / finalZ) * fov + canvas.height / 2,
                depth: finalZ
            };
        }

        // Rita en byggnad stabilt
        function drawBuilding(b) {
            const h = b.dmg > 0.3 ? b.h : b.h * 0.4; // Sönderbombad höjd
            
            // Beräkna basen och toppen av byggnaden
            const pBase = project(b.x, 0, b.z);
            const pTop = project(b.x, h, b.z);

            if (!pBase || !pTop) return; // Rita inte om huset är utom synhåll

            // Räkna ut storlek på skärmen baserat på avstånd (djup)
            const sizeW = (b.w / pBase.depth) * Math.min(canvas.width, canvas.height);
            const sizeH = pBase.y - pTop.y;

            // Om huset lutar på grund av skador (War zone-effekt)
            ctx.save();
            ctx.translate(pBase.x, pBase.y);
            if (b.dmg <= 0.3 && b.dmg > 0.1) {
                ctx.rotate((b.x % 2 === 0 ? 0.15 : -0.15)); // Luta huset slumpmässigt
            }

            // Rita husets framsida
            ctx.fillStyle = b.dmg < 0.1 ? '#3e3a36' : b.color; // Totalt förstörda hus blir askgrå
            ctx.strokeStyle = '#222';
            ctx.lineWidth = Math.max(1, 4 / pBase.depth);
            
            ctx.beginPath();
            ctx.rect(-sizeW / 2, -sizeH, sizeW, sizeH);
            ctx.fill();
            ctx.stroke();

            // Rita dörr på stående hus
            if (b.dmg > 0.3) {
                ctx.fillStyle = '#111';
                ctx.fillRect(-sizeW * 0.12, -sizeH * 0.25, sizeW * 0.24, sizeH * 0.25);
            }
            ctx.restore();
        }

        // Spelslingan
        function gameLoop() {
            requestAnimationFrame(gameLoop);
            const timeNow = performance.now();
            const delta = Math.min((timeNow - lastTime) / 1000, 0.1);
            lastTime = timeNow;

            if (isMouseLocked) {
                let moveX = 0, moveZ = 0;
                if (keys.w) { moveX += Math.sin(player.yaw); moveZ += Math.cos(player.yaw); }
                if (keys.s) { moveX -= Math.sin(player.yaw); moveZ -= Math.cos(player.yaw); }
                if (keys.a) { moveX += Math.cos(player.yaw); moveZ -= Math.sin(player.yaw); }
                if (keys.d) { moveX -= Math.cos(player.yaw); moveZ += Math.sin(player.yaw); }

                player.x += moveX * 16 * delta;
                player.z += moveZ * 16 * delta;

                // Hopp-fysik
                velocityY -= 28 * delta;
                player.y += velocityY * delta;

                if (keys.space && isGrounded) { velocityY = 11; isGrounded = false; }
                if (player.y < 2) { player.y = 2; velocityY = 0; isGrounded = true; }
            }

            // RENDERING
            // Rita himlen (Solnedgång i öknen)
            ctx.fillStyle = '#d5a97a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Rita ökensanden
            const horizon = canvas.height / 2 + Math.tan(player.pitch) * (canvas.height / 2);
            ctx.fillStyle = '#c29d70';
            ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);

            // Sortera byggnader utifrån avstånd (rita de längst bort först)
            buildings.forEach(b => {
                b.dist = Math.pow(b.x - player.x, 2) + Math.pow(b.z - player.z, 2);
            });
            buildings.sort((a, b) => b.dist - a.dist);

            // Rita byggnaderna på skärmen
            buildings.forEach(b => drawBuilding(b));

            // Skapa sandstorms-effekt (Lägg en svag dimma över allt)
            ctx.fillStyle = 'rgba(213, 169, 122, 0.35)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        gameLoop();
    </script>
</body>
</html>
